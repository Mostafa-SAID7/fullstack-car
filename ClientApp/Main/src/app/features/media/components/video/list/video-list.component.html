<div class="video-list-container p-4 lg:p-8 max-w-[1600px] mx-auto animate-fade-in">

  <!-- Card 1: Search & Actions -->
  <div *ngIf="!compact"
    class="bg-white dark:bg-[#111] rounded-[2.5rem] p-6 shadow-xl border border-black/5 dark:border-white/5 mb-6">
    <form [formGroup]="searchForm" class="flex flex-col md:flex-row gap-4 mb-6">
      <!-- Search Input -->
      <div class="relative flex-grow group">
        <i
          class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors duration-300"></i>
        <input formControlName="searchTerm" type="text" placeholder="Search videos..."
          class="w-full bg-secondary/30 dark:bg-white/5 border-2 border-transparent focus:border-primary/20 rounded-full pl-12 pr-6 py-4 outline-none transition-all text-foreground font-bold">
      </div>

      <!-- Filter Toggle -->
      <button type="button" (click)="toggleFilters()"
        [ngClass]="showFilters ? 'bg-primary text-white' : 'bg-secondary dark:bg-white/5'"
        class="px-8 py-4 rounded-full font-black uppercase text-xs tracking-widest hover:scale-105 active:scale-95 transition-all flex items-center gap-3 whitespace-nowrap">
        <i class="fas fa-sliders-h"></i>
        <span>Filters</span>
      </button>

      <!-- Upload Action -->
      <button (click)="navigateToUpload()"
        class="px-8 py-4 bg-primary text-white rounded-full font-black uppercase text-xs tracking-widest hover:scale-105 active:scale-95 transition-all shadow-lg shadow-primary/25 flex items-center gap-3 whitespace-nowrap">
        <i class="fas fa-cloud-upload-alt"></i>
        <span>Upload</span>
      </button>
    </form>

    <!-- Collapsible Filters Panel -->
    <div class="overflow-hidden transition-all duration-300 ease-in-out"
      [style.max-height]="showFilters ? '1000px' : '0'" [style.opacity]="showFilters ? '1' : '0'">
      <div class="pt-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
          <div class="flex flex-col">
            <label
              class="text-[10px] font-black text-primary uppercase tracking-[0.2em] mb-3 ml-4 opacity-70">Status</label>
            <div class="relative">
              <i class="fas fa-tag absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
              <select formControlName="status"
                class="w-full bg-secondary/30 dark:bg-white/5 border-none rounded-2xl pl-12 pr-6 py-4 outline-none transition-all text-sm font-bold cursor-pointer appearance-none">
                <option value="">All Statuses</option>
                <option value="Processing">Processing</option>
                <option value="Ready">Ready</option>
                <option value="Failed">Failed</option>
              </select>
              <i
                class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
          </div>
          <div class="flex flex-col">
            <label class="text-[10px] font-black text-primary uppercase tracking-[0.2em] mb-3 ml-4 opacity-70">Sort
              By</label>
            <div class="relative">
              <i class="fas fa-sort absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
              <select formControlName="sortBy"
                class="w-full bg-secondary/30 dark:bg-white/5 border-none rounded-2xl pl-12 pr-6 py-4 outline-none transition-all text-sm font-bold cursor-pointer appearance-none">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="views">Most Views</option>
                <option value="likes">Most Likes</option>
              </select>
              <i
                class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Card 2: Content Grid -->
  <div
    class="bg-white dark:bg-[#111] rounded-[2.5rem] p-6 lg:p-8 shadow-xl border border-black/5 dark:border-white/5 min-h-[500px] mb-6">
    <!-- Loading State -->
    <div *ngIf="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="animate-pulse">
        <div class="aspect-video bg-secondary/30 dark:bg-white/5 rounded-2xl mb-4"></div>
        <div class="h-4 bg-secondary/30 dark:bg-white/5 rounded-full w-3/4 mb-3"></div>
        <div class="h-3 bg-secondary/30 dark:bg-white/5 rounded-full w-1/2"></div>
      </div>
    </div>

    <!-- Video Grid -->
    <div *ngIf="!loading && videos.length > 0"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <app-media-card *ngFor="let video of videos" [media]="video" [type]="'video'" (play)="onPlay(video)">
      </app-media-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && videos.length === 0"
      class="py-24 text-center rounded-3xl border-2 border-dashed border-slate-200 dark:border-white/10">
      <div class="w-20 h-20 bg-secondary/30 dark:bg-white/5 rounded-full flex items-center justify-center mx-auto mb-8">
        <i class="fas fa-film text-3xl text-muted-foreground/30"></i>
      </div>
      <h3 class="text-xl font-black text-foreground uppercase tracking-widest mb-2">No videos found</h3>
      <p class="text-muted-foreground font-bold text-xs uppercase tracking-widest">Try adjusting your search criteria
      </p>
    </div>
  </div>

  <!-- Card 3: Pagination -->
  <div *ngIf="!compact"
    class="bg-white dark:bg-[#111] rounded-[2.5rem] p-6 shadow-xl border border-black/5 dark:border-white/5">
    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize"
      [totalItems]="totalCount" (pageChange)="onPageChange($event)"></app-pagination>
  </div>

</div>
