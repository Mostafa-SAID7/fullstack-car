<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>
<body>
    <h1>Login Test</h1>
    <form id="loginForm">
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="admin@fully2car.com" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="Admin123!" required>
        </div>
        <div>
            <label>
                <input type="checkbox" id="rememberMe"> Remember Me
            </label>
        </div>
        <button type="submit">Login</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            const loginData = {
                email: email,
                password: password,
                rememberMe: rememberMe
            };
            
            console.log('Sending login request:', loginData);
            
            try {
                const response = await fetch('http://localhost:5101/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData)
                });
                
                const result = await response.text();
                console.log('Response status:', response.status);
                console.log('Response:', result);
                
                document.getElementById('result').innerHTML = `
                    <h3>Response (${response.status}):</h3>
                    <pre>${result}</pre>
                `;
                
                if (response.ok) {
                    const data = JSON.parse(result);
                    if (data.succeeded) {
                        alert('Login successful!');
                    } else {
                        alert('Login failed: ' + (data.message || 'Unknown error'));
                    }
                } else {
                    alert('HTTP Error: ' + response.status);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        });
    </script>
</body>
</html>
