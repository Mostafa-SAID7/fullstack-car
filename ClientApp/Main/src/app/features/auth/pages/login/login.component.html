<!-- Modern Login Page with shadcn/ui + Tailwind CSS styling -->
<div class="min-h-screen-mobile bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 relative">
  <!-- Background Effects -->
  <div class="absolute inset-0 opacity-20" style="background-image: url('data:image/svg+xml,%3Csvg width=&quot;60&quot; height=&quot;60&quot; viewBox=&quot;0 0 60 60&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Cg fill=&quot;none&quot; fill-rule=&quot;evenodd&quot;%3E%3Cg fill=&quot;%239C92AC&quot; fill-opacity=&quot;0.05&quot;%3E%3Ccircle cx=&quot;30&quot; cy=&quot;30&quot; r=&quot;2&quot;/%3E%3C/g%3E%3C/g%3E%3C/svg%3E')"></div>
  
  <!-- Scrollable Container -->
  <div class="scrollable-container custom-scrollbar">
    <div class="min-h-full flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <div class="max-w-md w-full space-y-6 sm:space-y-8 relative z-10">
        <!-- Glass Card Container -->
        <div class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-2xl sm:rounded-3xl shadow-2xl p-6 sm:p-8 lg:p-10 relative overflow-hidden">
          <!-- Glass effect overlay -->
          <div class="absolute inset-0 bg-gradient-to-br from-white/20 via-white/10 to-transparent pointer-events-none"></div>
          
          <!-- Content -->
          <div class="relative z-10">
            <!-- Logo -->
            <div class="text-center mb-6 sm:mb-8">
              <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-pink-500 to-pink-600 rounded-xl sm:rounded-2xl flex items-center justify-center mx-auto mb-4 sm:mb-6 shadow-lg backdrop-blur-sm">
                <svg class="w-8 h-8 sm:w-10 sm:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
              <h1 class="text-2xl sm:text-3xl font-black text-white mb-2">Welcome Back</h1>
              <p class="text-gray-300 font-medium text-sm sm:text-base">Sign in to continue to Community Car</p>
            </div>

            <!-- Login Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4 sm:space-y-6">
              <!-- Error Message -->
              <div *ngIf="error" class="p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 flex items-start gap-2 text-sm backdrop-blur-sm">
                <svg class="w-4 h-4 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                </svg>
                <p class="leading-relaxed">{{ error }}</p>
              </div>

              <!-- Email Input -->
              <div class="space-y-1">
                <label for="email" class="text-sm font-medium text-gray-200 ml-1">Email Address</label>
                <div class="relative">
                  <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                  </svg>
                  <input
                    id="email"
                    type="email"
                    formControlName="email"
                    placeholder="name@example.com"
                    class="w-full pl-10 pr-4 py-2.5 sm:py-3 border border-white/10 bg-black/20 text-white placeholder:text-gray-400 rounded-lg focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500/50 outline-none transition-all duration-200 backdrop-blur-md text-sm sm:text-base"
                    [class.border-red-300]="emailControl.invalid && emailControl.touched">
                </div>
                <div *ngIf="emailControl.invalid && emailControl.touched" class="mt-1 text-xs sm:text-sm text-red-400 font-medium ml-1">
                  <span *ngIf="emailControl.errors?.['required']">Email is required</span>
                  <span *ngIf="emailControl.errors?.['email']">Please enter a valid email</span>
                </div>
              </div>

              <!-- Password Input -->
              <div class="space-y-1">
                <div class="flex justify-between items-center mb-1">
                  <label for="password" class="text-sm font-medium text-gray-200 ml-1">Password</label>
                  <a
                    routerLink="/auth/forgot-password"
                    class="text-xs font-semibold text-pink-400 hover:text-white transition-colors">
                    Forgot password?
                  </a>
                </div>
                <div class="relative">
                  <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                  </svg>
                  <input
                    id="password"
                    [type]="showPassword ? 'text' : 'password'"
                    formControlName="password"
                    placeholder="••••••••"
                    class="w-full pl-10 pr-10 py-2.5 sm:py-3 border border-white/10 bg-black/20 text-white placeholder:text-gray-400 rounded-lg focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500/50 outline-none transition-all duration-200 backdrop-blur-md text-sm sm:text-base"
                    [class.border-red-300]="passwordControl.invalid && passwordControl.touched">
                  <button
                    type="button"
                    (click)="showPassword = !showPassword"
                    class="absolute right-3 top-1/2 -translate-y-1/2 p-1 rounded-md hover:bg-white/10 text-gray-400 hover:text-white transition-colors">
                    <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <svg *ngIf="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                    </svg>
                  </button>
                </div>
                <div *ngIf="passwordControl.invalid && passwordControl.touched" class="mt-1 text-xs sm:text-sm text-red-400 font-medium ml-1">
                  <span *ngIf="passwordControl.errors?.['required']">Password is required</span>
                  <span *ngIf="passwordControl.errors?.['minlength']">Password must be at least 6 characters</span>
                </div>
              </div>

              <!-- Remember Me -->
              <div class="flex items-center justify-between">
                <div class="flex items-center">
                  <input
                    id="remember-me"
                    type="checkbox"
                    formControlName="rememberMe"
                    class="w-4 h-4 text-pink-600 bg-transparent border-white/20 rounded focus:ring-pink-500 focus:ring-2">
                  <label for="remember-me" class="ml-2 block text-sm text-gray-300 cursor-pointer select-none">
                    Remember me
                  </label>
                </div>
              </div>

              <!-- Submit Button -->
              <button
                type="submit"
                [disabled]="loginForm.invalid || loading"
                class="w-full flex justify-center py-2.5 sm:py-3 px-4 text-base sm:text-lg font-bold bg-gradient-to-r from-pink-600 to-pink-500 text-white rounded-lg shadow-lg hover:shadow-pink-500/25 hover:from-pink-500 hover:to-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-offset-2 focus:ring-offset-transparent disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 border border-pink-500/20">
                
                <span *ngIf="loading" class="flex items-center">
                  <svg class="animate-spin -ml-1 mr-3 h-4 w-4 sm:h-5 sm:w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  Signing in...
                </span>
                <span *ngIf="!loading">Sign In</span>
              </button>
            </form>

            <!-- Divider -->
            <div class="mt-4 sm:mt-6">
              <div class="relative">
                <div class="absolute inset-0 flex items-center">
                  <div class="w-full border-t border-white/10"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                  <span class="px-2 bg-transparent text-gray-400">
                    Don't have an account?
                  </span>
                </div>
              </div>

              <div class="mt-4 sm:mt-6">
                <a routerLink="/auth/register">
                  <button
                    type="button"
                    class="w-full py-2.5 sm:py-3 px-4 border border-white/10 bg-transparent text-white hover:bg-white/5 hover:text-white hover:border-white/20 rounded-lg font-medium transition-all duration-200 text-sm sm:text-base">
                    Create a new account
                  </button>
                </a>
              </div>
            </div>

            <!-- OAuth Buttons (Optional - can be removed if not needed) -->
            <div class="mt-4 sm:mt-6 space-y-3" *ngIf="false">
              <button
                type="button"
                (click)="loginWithGoogle()"
                class="w-full flex items-center justify-center px-4 py-2.5 sm:py-3 border border-white/10 bg-white/5 rounded-lg hover:bg-white/10 transition-all duration-200 group">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 mr-3" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span class="text-white font-medium group-hover:text-white transition-colors text-sm sm:text-base">Continue with Google</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-white/60 text-xs sm:text-sm mt-6 sm:mt-8">
          <p class="mb-2">© 2024 Community Car. All rights reserved.</p>
          <div class="flex justify-center space-x-4">
            <a href="#" class="hover:text-white/80 transition-colors">Privacy Policy</a>
            <a href="#" class="hover:text-white/80 transition-colors">Terms of Service</a>
            <a href="#" class="hover:text-white/80 transition-colors">Support</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
