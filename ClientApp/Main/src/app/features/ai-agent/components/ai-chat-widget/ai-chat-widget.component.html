<div class="fixed bottom-4 right-4 sm:bottom-8 sm:right-8 z-[1000] flex flex-col items-end group" [class.open]="isOpen">
    <!-- Trigger Button -->
    <button (click)="toggleChat()"
        class="w-[50px] h-[50px] sm:w-[60px] sm:h-[60px] rounded-full bg-card border border-border shadow-xl flex items-center justify-center cursor-pointer transition-all duration-300 text-foreground text-xl sm:text-2xl relative z-10 hover:scale-110 hover:shadow-primary/30 hover:border-primary hover:text-primary active:scale-95 group-[.open]:scale-90 group-[.open]:bg-primary group-[.open]:text-white">
        <i class="fas" [ngClass]="isOpen ? 'fa-times' : 'fa-robot'"></i>
        <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-card animate-bounce"
            *ngIf="hasUnreadMessages && !isOpen"></span>
    </button>

    <!-- Chat Window -->
    <div
        class="absolute bottom-16 sm:bottom-20 right-0 w-[calc(100vw-2rem)] sm:w-[400px] h-[calc(100vh-120px)] sm:h-[650px] max-h-[650px] bg-background/80 backdrop-blur-3xl rounded-[2rem] border border-white/10 shadow-2xl flex flex-col overflow-hidden transition-all duration-400 ease-in-out origin-bottom-right [transform:translateY(20px)_scale(0.95)] opacity-0 pointer-events-none group-[.open]:opacity-100 group-[.open]:transform-none group-[.open]:pointer-events-auto">

        <!-- Header -->
        <div class="p-4 flex items-center justify-between border-b border-border/50 bg-white/5 relative">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary/10 border border-primary/20 rounded-2xl flex items-center justify-center text-primary cursor-pointer hover:bg-primary/20 transition-colors"
                    (click)="showModes = !showModes">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="cursor-pointer" (click)="showModes = !showModes">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-base text-foreground tracking-tight">AI Assistant</span>
                        <i class="fas fa-chevron-down text-[10px] text-muted-foreground transition-transform duration-300"
                            [class.rotate-180]="showModes"></i>
                    </div>
                    <span
                        class="text-[10px] text-emerald-500 font-bold uppercase tracking-[0.2em] block leading-none mt-1">
                        {{ getCurrentModeLabel() }} Mode
                    </span>
                </div>
            </div>

            <!-- Mode Dropdown -->
            <div class="absolute top-full left-4 right-4 bg-card/95 backdrop-blur-xl border border-border/50 rounded-2xl p-2 z-20 shadow-2xl mt-2 animate-fade-in max-h-[400px] overflow-y-auto"
                *ngIf="showModes">
                <button *ngFor="let mode of agentModes" (click)="setMode(mode.id)"
                    class="w-full flex items-start gap-3 p-3 rounded-xl transition-all hover:bg-white/5 text-sm"
                    [ngClass]="{'text-primary bg-primary/10': selectedMode === mode.id}">
                    <i class="fas {{mode.icon}} w-4 mt-0.5"></i>
                    <div class="flex-1 text-left">
                        <div class="font-medium">{{ mode.label }}</div>
                        <div class="text-xs text-muted-foreground mt-0.5">{{ mode.description }}</div>
                    </div>
                </button>
            </div>

            <button
                class="w-8 h-8 flex items-center justify-center text-muted-foreground hover:bg-white/10 hover:text-foreground rounded-full transition-all hover:rotate-90"
                (click)="toggleChat()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Messages -->
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-5 custom-scroll scroll-smooth" #scrollContainer>
            <div *ngFor="let msg of messages" class="flex flex-col max-w-[85%] relative animate-slide-up group/message"
                [class.self-end]="msg.isUser" [class.items-end]="msg.isUser" [class.self-start]="!msg.isUser"
                [class.items-start]="!msg.isUser">

                <!-- Message Bubble -->
                <div class="relative">
                    <!-- Image if present -->
                    <img *ngIf="msg.imageUrl" [src]="msg.imageUrl" alt="Uploaded image"
                        class="max-w-full rounded-xl mb-2 border border-border/50">

                    <!-- Text Content -->
                    <div class="p-3.5 text-sm leading-relaxed"
                        [class]="msg.isUser ? 'bg-primary text-primary-foreground rounded-2xl rounded-tr-none shadow-lg shadow-primary/20' : 'bg-secondary/50 text-foreground rounded-2xl rounded-tl-none border border-border/50'"
                        [innerHTML]="renderMarkdown(msg.text || '')">
                    </div>

                    <!-- Message Actions (for AI messages only) -->
                    <div *ngIf="!msg.isUser && msg.agent !== 'system'"
                        class="absolute -bottom-8 left-0 flex gap-1 opacity-0 group-hover/message:opacity-100 transition-opacity">
                        <button *ngFor="let action of getMessageActions(msg)" (click)="action.action()"
                            class="w-7 h-7 rounded-lg bg-secondary/80 border border-border/50 flex items-center justify-center text-muted-foreground hover:text-foreground hover:bg-secondary transition-all text-xs"
                            [title]="action.label">
                            <i class="fas {{action.icon}}"></i>
                        </button>
                    </div>
                </div>

                <!-- Timestamp -->
                <span class="text-[9px] text-muted-foreground/60 mt-1 px-1 font-bold uppercase tracking-wider">
                    {{ getRelativeTime(msg.timestamp) }}
                </span>
            </div>

            <!-- Typing Indicator -->
            <div class="flex flex-col gap-2 animate-fade-in" *ngIf="isTyping">
                <div class="flex gap-1.5 p-3 bg-secondary/30 rounded-2xl w-fit">
                    <span class="w-1.5 h-1.5 bg-primary/40 rounded-full animate-typing"></span>
                    <span class="w-1.5 h-1.5 bg-primary/40 rounded-full animate-typing"
                        [style.animation-delay]="'-0.16s'"></span>
                    <span class="w-1.5 h-1.5 bg-primary/40 rounded-full animate-typing"
                        [style.animation-delay]="'-0.32s'"></span>
                </div>
                <span class="text-[9px] text-muted-foreground/60 px-1 font-medium">
                    {{ getCurrentModeLabel() }} is thinking...
                </span>
            </div>

            <!-- Suggestions -->
            <div class="flex flex-wrap gap-2 mt-2 animate-fade-in"
                *ngIf="messages.length > 0 && !messages[messages.length-1].isUser && !isTyping">
                <button *ngFor="let suggestion of suggestions" (click)="selectSuggestion(suggestion)"
                    class="bg-white/5 border border-border/50 text-muted-foreground px-3 py-1.5 rounded-xl text-[12px] font-medium transition-all hover:bg-primary/10 hover:border-primary/30 hover:text-primary hover:-translate-y-0.5 active:scale-95">
                    {{ suggestion }}
                </button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-black/5 border-t border-border/50">
            <!-- Image Preview -->
            <div *ngIf="imagePreview" class="mb-3 relative inline-block">
                <img [src]="imagePreview" alt="Preview" class="max-w-[150px] rounded-xl border border-border/50">
                <button (click)="removeImage()"
                    class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center hover:bg-red-600 transition-colors">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>

            <!-- Input Row -->
            <div class="flex gap-2">
                <!-- Image Upload Button -->
                <input type="file" #fileInput accept="image/*" (change)="onFileSelected($event)" class="hidden">
                <button (click)="triggerFileInput()" [disabled]="isTyping"
                    class="bg-secondary/50 border border-transparent rounded-2xl w-12 h-12 flex items-center justify-center text-muted-foreground hover:text-foreground hover:bg-secondary transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                    <i class="fas fa-image"></i>
                </button>

                <!-- Text Input -->
                <input type="text" [(ngModel)]="currentMessage" (keyup.enter)="sendMessage()"
                    placeholder="Ask me anything..." [disabled]="isTyping"
                    class="flex-1 bg-secondary/50 border border-transparent rounded-2xl px-4 py-3 text-sm text-foreground focus:outline-none focus:border-primary/50 focus:bg-background transition-all placeholder:text-muted-foreground/40 shadow-inner">

                <!-- Send Button -->
                <button (click)="sendMessage()" [disabled]="(!currentMessage.trim() && !selectedImage) || isTyping"
                    class="bg-primary text-white rounded-2xl w-12 h-12 flex items-center justify-center transition-all hover:-translate-y-0.5 hover:shadow-lg hover:shadow-primary/40 disabled:opacity-30 disabled:cursor-not-allowed disabled:bg-secondary disabled:translate-y-0 disabled:shadow-none hover:bg-primary/90 active:scale-95">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>
