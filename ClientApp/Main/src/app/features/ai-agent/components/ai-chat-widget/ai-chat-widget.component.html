<div class="fixed bottom-4 right-4 sm:bottom-8 sm:right-8 z-[1000] flex flex-col items-end group" [class.open]="isOpen">
    <!-- Trigger Button -->
    <button (click)="toggleChat()"
        class="w-[50px] h-[50px] sm:w-[60px] sm:h-[60px] rounded-full bg-card border border-border shadow-xl flex items-center justify-center cursor-pointer transition-all duration-300 text-foreground text-xl sm:text-2xl relative z-10 hover:scale-110 hover:shadow-primary/30 hover:border-primary hover:text-primary active:scale-95 group-[.open]:scale-90 group-[.open]:bg-primary group-[.open]:text-white">
        <i class="fas" [ngClass]="isOpen ? 'fa-times' : 'fa-robot'"></i>
        <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-card animate-bounce"
            *ngIf="hasUnreadMessages && !isOpen"></span>
    </button>

    <!-- Chat Window -->
    <div
        class="absolute bottom-16 sm:bottom-20 right-0 w-[calc(100vw-2rem)] sm:w-[380px] h-[calc(100vh-120px)] sm:h-[600px] max-h-[600px] bg-background/80 backdrop-blur-3xl rounded-[2rem] border border-white/10 shadow-2xl flex flex-col overflow-hidden transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] origin-bottom-right [transform:translateY(20px)_scale(0.95)] opacity-0 pointer-events-none group-[.open]:opacity-100 group-[.open]:transform-none group-[.open]:pointer-events-auto">
        <!-- Header -->
        <div class="p-4 flex items-center justify-between border-b border-border/50 bg-white/5 relative">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary/10 border border-primary/20 rounded-2xl flex items-center justify-center text-primary cursor-pointer hover:bg-primary/20 transition-colors"
                    (click)="showModes = !showModes">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="cursor-pointer" (click)="showModes = !showModes">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-base text-foreground tracking-tight">AI Assistant</span>
                        <i class="fas fa-chevron-down text-[10px] text-muted-foreground transition-transform duration-300"
                            [class.rotate-180]="showModes"></i>
                    </div>
                    <span
                        class="text-[10px] text-emerald-500 font-bold uppercase tracking-[0.2em] block leading-none mt-1">{{
                        mode }} Mode</span>
                </div>
            </div>

            <!-- Mode Dropdown -->
            <div class="absolute top-full left-4 right-4 bg-card/95 backdrop-blur-xl border border-border/50 rounded-2xl p-2 z-20 shadow-2xl mt-2 animate-fade-in"
                *ngIf="showModes">
                <button (click)="setMode('chat')"
                    class="w-full flex items-center gap-3 p-3 rounded-xl transition-all hover:bg-white/5 text-sm"
                    [ngClass]="{'text-primary bg-primary/10': mode === 'chat'}">
                    <i class="fas fa-comments w-4"></i> General Chat
                </button>
                <button (click)="setMode('maintenance')"
                    class="w-full flex items-center gap-3 p-3 rounded-xl transition-all hover:bg-white/5 text-sm"
                    [ngClass]="{'text-primary bg-primary/10': mode === 'maintenance'}">
                    <i class="fas fa-wrench w-4"></i> Maintenance
                </button>
                <button (click)="setMode('recommendation')"
                    class="w-full flex items-center gap-3 p-3 rounded-xl transition-all hover:bg-white/5 text-sm"
                    [ngClass]="{'text-primary bg-primary/20': mode === 'recommendation'}">
                    <i class="fas fa-search w-4"></i> Car Matching
                </button>
            </div>

            <button
                class="w-8 h-8 flex items-center justify-center text-muted-foreground hover:bg-white/10 hover:text-foreground rounded-full transition-all hover:rotate-90"
                (click)="toggleChat()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Messages -->
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-5 custom-scroll scroll-smooth" #scrollContainer>
            <div *ngFor="let msg of messages" class="flex flex-col max-w-[85%] relative animate-slide-up"
                [class.self-end]="msg.isUser" [class.items-end]="msg.isUser" [class.self-start]="!msg.isUser"
                [class.items-start]="!msg.isUser">
                <div class="p-3.5 text-sm leading-relaxed"
                    [class]="msg.isUser ? 'bg-primary text-primary-foreground rounded-2xl rounded-tr-none shadow-lg shadow-primary/20' : 'bg-secondary/50 text-foreground rounded-2xl rounded-tl-none border border-border/50'"
                    [innerHTML]="parseMarkdown(msg.text || '')">
                </div>
                <span class="text-[9px] text-muted-foreground/60 mt-1 px-1 font-bold uppercase tracking-wider">
                    {{ msg.timestamp | date:'shortTime' }}
                </span>
            </div>

            <!-- Typing Indicator -->
            <div class="flex gap-1.5 p-3 bg-secondary/30 rounded-2xl w-fit animate-fade-in" *ngIf="isTyping">
                <span class="w-1.5 h-1.5 bg-primary/40 rounded-full animate-typing"></span>
                <span class="w-1.5 h-1.5 bg-primary/40 rounded-full animate-typing"
                    [style.animation-delay]="'-0.16s'"></span>
                <span class="w-1.5 h-1.5 bg-primary/40 rounded-full animate-typing"
                    [style.animation-delay]="'-0.32s'"></span>
            </div>

            <!-- Suggestions -->
            <div class="flex flex-wrap gap-2 mt-2 animate-fade-in"
                *ngIf="messages.length > 0 && !messages[messages.length-1].isUser && !isTyping">
                <button *ngFor="let suggestion of suggestions" (click)="selectSuggestion(suggestion)"
                    class="bg-white/5 border border-border/50 text-muted-foreground px-3 py-1.5 rounded-xl text-[12px] font-medium transition-all hover:bg-primary/10 hover:border-primary/30 hover:text-primary hover:-translate-y-0.5 active:scale-95">
                    {{ suggestion }}
                </button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-black/5 border-t border-border/50 flex gap-3">
            <input type="text" [(ngModel)]="currentMessage" (keyup.enter)="sendMessage()"
                placeholder="Ask me anything..." [disabled]="isTyping"
                class="flex-1 bg-secondary/50 border border-transparent rounded-2xl px-4 py-3 text-sm text-foreground focus:outline-none focus:border-primary/50 focus:bg-background transition-all placeholder:text-muted-foreground/40 shadow-inner">
            <button (click)="sendMessage()" [disabled]="!currentMessage.trim() || isTyping"
                class="bg-primary text-white rounded-2xl w-12 flex items-center justify-center transition-all hover:-translate-y-0.5 hover:shadow-lg hover:shadow-primary/40 disabled:opacity-30 disabled:cursor-not-allowed disabled:bg-secondary disabled:translate-y-0 disabled:shadow-none hover:bg-primary/90 active:scale-95">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
