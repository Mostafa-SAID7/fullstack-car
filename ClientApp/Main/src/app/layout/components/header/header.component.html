<div
    class="h-16 relative bg-inherit flex items-center justify-between px-4 sm:px-6 transition-all duration-400 ease-[cubic-bezier(0.4,0,0.2,1)] z-50">

    <!-- LEFT: Logo -->
    <div class="flex items-center gap-2 sm:gap-3 z-10">
        <!-- Mobile Toggle + Logo (Styled Container) -->
        <div
            class="md:hidden flex items-center gap-1 bg-white dark:bg-[#111] border border-black/5 dark:border-white/10 rounded-2xl p-1 shadow-xl dark:shadow-2xl transition-all">
            <!-- Sidebar Toggle -->
            <button
                class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-black/5 dark:hover:bg-white/10 transition-colors"
                (click)="layoutService.toggleMobileMenu()">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <!-- Mobile Logo -->
            <div routerLink="/"
                class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center cursor-pointer hover:opacity-90 transition-opacity flex-shrink-0 shadow-lg shadow-primary/20">
                <span class="text-white font-black text-xl tracking-tighter italic">CC</span>
            </div>
        </div>

        <!-- Desktop Brand Pill (Logo + Text) -->
        <div routerLink="/"
            class="hidden md:flex items-center gap-3 bg-white dark:bg-[#111] border border-black/5 dark:border-white/10 rounded-full p-1.5 pr-6 shadow-xl dark:shadow-2xl hover:shadow-2xl transition-all cursor-pointer group">
            <div
                class="w-10 h-10 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/20 group-hover:scale-105 transition-transform">
                <span class="text-white font-black text-xl tracking-tighter italic">CC</span>
            </div>
            <span class="font-bold text-lg tracking-tight text-gray-900 dark:text-white">Community Car</span>
        </div>
    </div>

    <!-- CENTER: Search + Nav + Theme (Desktop Only - lg:flex) -->
    <div
        class="flex items-center justify-between bg-white dark:bg-[#111] border border-black/5 dark:border-white/10 rounded-full p-1.5 shadow-xl dark:shadow-2xl absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 max-w-[900px] w-fit transition-all duration-300">

        <!-- Search Bar (Visual) -->
        <div (click)="toggleSearch()"
            class="hidden lg:flex items-center gap-3 bg-secondary/50 dark:bg-white/5 hover:bg-secondary dark:hover:bg-white/10 transition-colors border border-transparent dark:border-white/5 rounded-full px-4 h-10 w-64 cursor-text group mr-2">
            <i
                class="fa-solid fa-search text-lg text-gray-500 dark:text-gray-400 group-hover:text-primary transition-colors"></i>
            <span class="text-sm text-gray-500 dark:text-gray-400 font-medium">Search</span>
        </div>

        <!-- Navigation Links -->
        <nav class="flex items-center gap-1 mx-2">
            <!-- Home -->
            <div routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                class="relative w-10 h-10 flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-secondary dark:hover:bg-white/5 rounded-full group active:scale-95 [&.active]:bg-primary/10"
                matTooltip="Home">
                <i
                    class="fa-solid fa-house text-xl text-black dark:text-white group-hover:text-primary group-[.active]:!text-primary transition-colors group-hover:scale-110"></i>
            </div>





            <!-- Video -->
            <div routerLink="/media" routerLinkActive="active"
                class="relative w-10 h-10 flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-secondary dark:hover:bg-white/5 rounded-full group active:scale-95 [&.active]:bg-primary/10"
                matTooltip="Media">
                <div class="relative">
                    <i
                        class="fa-solid fa-video text-xl text-black dark:text-white group-hover:text-primary group-[.active]:!text-primary transition-colors group-hover:scale-110"></i>
                    <span
                        class="absolute -top-1.5 -right-1.5 bg-primary text-[9px] font-black text-white px-1 py-0.5 rounded-full border-2 border-white dark:border-[#111] min-w-[14px] h-[14px] flex items-center justify-center">9+</span>
                </div>
            </div>

            <!-- Marketplace -->
            <div routerLink="/marketplace" routerLinkActive="active"
                class="relative w-10 h-10 flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-secondary dark:hover:bg-white/5 rounded-full group active:scale-95 [&.active]:bg-primary/10"
                matTooltip="Marketplace">
                <i
                    class="fa-solid fa-store text-xl text-black dark:text-white group-hover:text-primary group-[.active]:!text-primary transition-colors group-hover:scale-110"></i>
            </div>
        </nav>

        <!-- Vertical Divider -->
        <div class="w-[1px] h-6 bg-border/50 dark:bg-white/10 mx-2"></div>

        <!-- Theme Toggle (Moved to Center) -->
        <button
            class="w-10 h-10 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-400 hover:text-primary hover:bg-secondary dark:hover:bg-white/5 transition-all duration-300 cursor-pointer active:scale-90 group"
            (click)="toggleTheme()" [matTooltip]="getThemeTooltip()">
            <i [class]="'fa-solid text-xl transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] group-hover:rotate-12 ' + (themeService.isDark() ? 'fa-moon' : 'fa-sun')"
                [class.text-primary]="true">
            </i>
        </button>
    </div>

    <!-- RIGHT: Option Icons -->
    <div
        class="flex items-center gap-1 lg:gap-1 flex-shrink-0 z-10 bg-white dark:bg-[#111] border border-black/5 dark:border-white/10 rounded-full p-1.5 shadow-xl dark:shadow-2xl transition-all duration-300">


        <!-- Language Switcher (Hidden on Mobile) -->
        <button
            class="hidden lg:flex w-10 h-10 rounded-full items-center justify-center text-muted-foreground hover:text-primary hover:bg-primary/5 hover:shadow-[inset_0_0_0_1px_hsl(var(--color-primary)/0.2)] transition-all duration-300 cursor-pointer active:scale-90 group"
            [matMenuTriggerFor]="langMenu" matTooltip="Language">
            <i
                class="fa-solid fa-globe text-xl text-black dark:text-white stroke-current group-hover:scale-110 transition-transform group-hover:text-primary"></i>
        </button>


        <!-- Notifications (Hidden on Mobile) -->
        <button
            class="hidden lg:flex w-10 h-10 rounded-full items-center justify-center text-muted-foreground hover:text-primary hover:bg-primary/5 hover:shadow-[inset_0_0_0_1px_hsl(var(--color-primary)/0.2)] transition-all duration-300 cursor-pointer active:scale-90 relative group"
            [matMenuTriggerFor]="notificationMenu" matTooltip="Notifications">
            <i class="fa-solid fa-bell text-xl text-black dark:text-white stroke-current group-hover:rotate-12 group-hover:scale-110 transition-transform group-hover:text-primary"
                [class.text-primary]="(unreadCount$ | async)! > 0"></i>
            <span *ngIf="(unreadCount$ | async)! > 0"
                class="absolute -top-1 -right-1 bg-primary text-[10px] font-black text-white px-1 py-0.5 rounded-full border-2 border-background shadow-lg shadow-primary/20 min-w-[16px] h-[16px] flex items-center justify-center animate-badge-pulse z-10">
                {{ (unreadCount$ | async)! > 99 ? '99+' : (unreadCount$ | async) }}
            </span>
        </button>

        <!-- Account Dropdown (Visible Always) -->
        <button [matMenuTriggerFor]="accountMenu"
            class="w-10 h-10 rounded-full bg-background/60 border border-white/5 shadow-sm relative overflow-hidden flex items-center justify-center cursor-pointer hover:bg-primary/5 hover:border-primary/30 hover:shadow-[inset_0_0_0_1px_hsl(var(--color-primary)/0.2)] transition-all active:scale-90 lg:ml-1 group"
            matTooltip="Account">
            <div
                class="w-full h-full flex items-center justify-center text-primary font-black italic text-xs group-hover:scale-110 transition-transform">
                {{ (currentUser$ | async)?.firstName?.[0] || 'U' }}{{ (currentUser$ | async)?.lastName?.[0] || 'P' }}
            </div>
        </button>

        <!-- Mobile More Options (Hidden on Desktop) -->
        <button
            class="flex lg:hidden w-10 h-10 rounded-full items-center justify-center text-muted-foreground hover:text-primary hover:bg-primary/5 hover:shadow-[inset_0_0_0_1px_hsl(var(--color-primary)/0.2)] transition-all duration-300 cursor-pointer active:scale-90 ml-1 group"
            [matMenuTriggerFor]="mobileOptionsMenu" matTooltip="Options">
            <i
                class="fa-solid fa-ellipsis-vertical text-xl text-black dark:text-white stroke-current group-hover:scale-110 transition-transform group-hover:text-primary"></i>
        </button>
    </div>

    <!-- MENUS & MODALS (Kept same as before, just positionally moved in HTML for tidiness) -->


    <!-- Search Overlay -->
    <div *ngIf="isSearchOpen"
        class="fixed inset-0 z-[100] flex items-start justify-center pt-2 sm:pt-4 px-2 sm:px-4 animate-fade-in">
        <div class="absolute inset-0 bg-background/80 backdrop-blur-md" (click)="toggleSearch()"></div>
        <div
            class="relative w-full max-w-2xl bg-card border border-border/40 shadow-2xl rounded-2xl overflow-hidden mt-2">
            <div class="flex items-center p-4 gap-4">
                <i class="fa-solid fa-search text-2xl text-primary"></i>
                <input type="text" placeholder="Search Community Car..."
                    class="w-full bg-transparent border-none outline-none text-lg text-foreground placeholder:text-muted-foreground/50"
                    autoFocus (keyup.escape)="toggleSearch()">
                <button
                    class="px-3 py-1 bg-secondary rounded-lg text-xs font-bold hover:bg-secondary/80 transition-colors"
                    (click)="toggleSearch()">ESC</button>
            </div>
        </div>
    </div>

    <!-- Language Menu -->
    <mat-menu #langMenu="matMenu" class="custom-mat-menu">
        <button 
            mat-menu-item 
            *ngFor="let language of supportedLanguages" 
            (click)="switchLanguage(language.code)" 
            [class.bg-secondary]="isLanguageSelected(language.code)">
            <span class="mr-2">{{ language.flag }}</span> 
            {{ language.name }}
        </button>
    </mat-menu>


    <!-- Notification Menu -->
    <mat-menu #notificationMenu="matMenu" class="notification-menu w-80 sm:w-96">
        <ng-template matMenuContent>
            <div class="px-4 py-3 border-b flex items-center justify-between bg-secondary/5"
                (click)="$event.stopPropagation()">
                <h3 class="font-bold text-sm uppercase tracking-widest text-muted-foreground">Notifications</h3>
                <button class="text-xs text-primary hover:underline font-bold" (click)="markAllRead()">Mark all as
                    read</button>
            </div>
            <div class="max-h-[70vh] overflow-y-auto">
                <ng-container *ngIf="(notifications$ | async) as notifications">
                    <div *ngIf="notifications.length === 0" class="p-8 text-center text-muted-foreground">
                        <i class="fa-solid fa-bell-slash text-4xl mb-2 opacity-30"></i>
                        <p class="text-xs font-medium">No notifications yet</p>
                    </div>

                    <a mat-menu-item *ngFor="let note of notifications"
                        class="!h-auto !py-3 !px-4 border-b last:border-0 hover:bg-secondary/50 transition-colors no-underline block"
                        [ngClass]="{
                            'bg-blue-50': !note.isRead && !themeService.isDark(),
                            'bg-blue-900/10': !note.isRead && themeService.isDark()
                        }" (click)="handleNotificationClick(note)">
                        <span class="flex items-start gap-3 w-full text-left">
                            <span
                                class="w-10 h-10 rounded-full bg-secondary flex-shrink-0 overflow-hidden relative block">
                                <img *ngIf="note.sourceUserAvatar; else defaultAvatar" [src]="note.sourceUserAvatar"
                                    class="w-full h-full object-cover" />
                                <ng-template #defaultAvatar>
                                    <i
                                        class="fa-solid fa-user absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-gray-500 text-lg"></i>
                                </ng-template>
                                <span *ngIf="!note.isRead"
                                    class="absolute top-0 right-0 w-3 h-3 bg-blue-500 rounded-full border-2 border-card"></span>
                            </span>
                            <span class="flex-1 min-w-0 flex flex-col items-start">
                                <span
                                    class="text-sm font-medium leading-tight mb-1 line-clamp-2 truncate-2-lines whitespace-normal text-left block">
                                    {{ note.message }}
                                </span>
                                <span class="text-xs text-muted-foreground">{{ note.createdAt | date:'short'
                                    }}</span>
                            </span>
                        </span>
                    </a>
                </ng-container>
            </div>
        </ng-template>
    </mat-menu>

    <!-- Account Menu -->
    <mat-menu #accountMenu="matMenu" class="custom-mat-menu w-56">
        <div class="px-4 py-3 border-b border-border/50 bg-secondary/5" (click)="$event.stopPropagation()">
            <p class="text-[10px] text-muted-foreground font-bold uppercase tracking-[0.2em] mb-1">Signed in as</p>
            <p class="text-xs font-bold text-foreground truncate">{{ (currentUser$ | async)?.firstName }} {{
                (currentUser$ | async)?.lastName }}</p>
        </div>
        <button mat-menu-item routerLink="/community/profile" class="!flex !items-center !gap-3">
            <i class="fa-solid fa-user-circle text-lg text-primary/70"></i>
            <span class="text-xs font-medium">My Profile</span>
        </button>
        <button mat-menu-item routerLink="/settings" class="!flex !items-center !gap-3">
            <i class="fa-solid fa-cog text-lg text-primary/70"></i>
            <span class="text-xs font-medium">Settings</span>
        </button>
        <div class="border-t border-border/50 my-1"></div>
        <button mat-menu-item (click)="logout()" class="!text-destructive !flex !items-center !gap-3">
            <i class="fa-solid fa-sign-out-alt text-lg"></i>
            <span class="text-xs font-medium">Sign Out</span>
        </button>
    </mat-menu>

    <!-- Mobile Options Menu -->
    <mat-menu #mobileOptionsMenu="matMenu" class="custom-mat-menu w-64">
        <button mat-menu-item (click)="toggleSearch()">
            <i class="fa-solid fa-search mr-3 text-lg"></i> Search
        </button>
        <button mat-menu-item [matMenuTriggerFor]="notificationMenu">
            <i class="fa-solid fa-bell mr-3 text-lg"></i> Notifications
            <span *ngIf="(unreadCount$ | async)! > 0"
                class="ml-auto bg-primary text-white text-[10px] px-1.5 py-0.5 rounded-full">
                {{ (unreadCount$ | async) }}
            </span>
        </button>
    </mat-menu>

</div>
