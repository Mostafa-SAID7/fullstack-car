<!DOCTYPE html>
<html>
<head>
    <title>Test Auth Flow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>Authentication Flow Test</h1>
    
    <div class="section">
        <h3>Step 1: Test Direct API Call</h3>
        <button onclick="testDirectAPI()">Test Login API</button>
        <div id="api-result" class="result"></div>
    </div>

    <div class="section">
        <h3>Step 2: Test AuthService</h3>
        <button onclick="testAuthService()">Test AuthService Login</button>
        <div id="service-result" class="result"></div>
    </div>

    <div class="section">
        <h3>Step 3: Check Local Storage</h3>
        <button onclick="checkStorage()">Check Storage</button>
        <div id="storage-result" class="result"></div>
    </div>

    <script>
        // Test direct API call
        async function testDirectAPI() {
            const resultDiv = document.getElementById('api-result');
            
            try {
                const response = await fetch('http://localhost:5101/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@communitycar.com',
                        password: 'TempPassword123!'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h4>✅ API Call Success</h4>
                    <p><strong>User:</strong> ${data.user.email}</p>
                    <p><strong>Roles:</strong> ${data.user.roles.join(', ')}</p>
                    <p><strong>Has Admin Role:</strong> ${data.user.roles.includes('Admin') ? 'Yes' : 'No'}</p>
                    <details>
                        <summary>Full Response</summary>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </details>
                `;

            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h4>❌ API Call Failed</h4>
                    <p>${error.message}</p>
                `;
            }
        }

        // Test AuthService (simulate)
        async function testAuthService() {
            const resultDiv = document.getElementById('service-result');
            
            try {
                // Simulate the AuthService login process
                const response = await fetch('http://localhost:5101/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@communitycar.com',
                        password: 'TempPassword123!'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                // Simulate setAuthData
                localStorage.setItem('token', data.token);
                localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('tokenExpiry', data.expiresAt);
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h4>✅ AuthService Simulation Success</h4>
                    <p>Data stored in localStorage</p>
                    <p><strong>User:</strong> ${data.user.email}</p>
                    <p><strong>Roles:</strong> ${data.user.roles.join(', ')}</p>
                `;

            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h4>❌ AuthService Simulation Failed</h4>
                    <p>${error.message}</p>
                `;
            }
        }

        // Check localStorage
        function checkStorage() {
            const resultDiv = document.getElementById('storage-result');
            
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            const expiry = localStorage.getItem('tokenExpiry');
            
            if (token && user) {
                const userData = JSON.parse(user);
                const expiryDate = new Date(expiry);
                const isExpired = expiryDate < new Date();
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h4>✅ Auth Data Found</h4>
                    <p><strong>User:</strong> ${userData.email}</p>
                    <p><strong>Roles:</strong> ${userData.roles.join(', ')}</p>
                    <p><strong>Has Admin Role:</strong> ${userData.roles.includes('Admin') ? 'Yes' : 'No'}</p>
                    <p><strong>Token Expired:</strong> ${isExpired ? 'Yes' : 'No'}</p>
                    <p><strong>Expires At:</strong> ${expiryDate.toLocaleString()}</p>
                    <button onclick="clearStorage()">Clear Storage</button>
                `;
            } else {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h4>❌ No Auth Data Found</h4>
                    <p>localStorage is empty</p>
                `;
            }
        }

        function clearStorage() {
            localStorage.removeItem('token');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('user');
            localStorage.removeItem('tokenExpiry');
            checkStorage();
        }

        // Auto-check storage on load
        window.onload = checkStorage;
    </script>
</body>
</html>
