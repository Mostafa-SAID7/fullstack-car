<div class="min-h-screen bg-background text-foreground flex flex-col">
    <!-- Header with Mica effect -->
    <app-header class="fixed top-0 left-0 w-full z-50 h-14"></app-header>

    <!-- Main Layout Container: Exactly fills viewport minus header -->
    <div
        class="flex-1 grid grid-cols-1 xl:grid-cols-[280px_1fr_280px] gap-6 max-w-[1920px] mx-auto w-full h-[calc(100vh-3.5rem)] mt-14 px-4 overflow-hidden bg-background/50">

        <!-- Left Sidebar -->
        <aside
            class="hidden xl:block h-[calc(100vh-3.5rem)] overflow-y-auto pb-4 custom-scroll border-r border-border/10">
            <app-sidebar-left class="block animate-fade-in"></app-sidebar-left>
        </aside>

        <!-- Main Content Area -->
        <main
            class="w-full h-[calc(100vh-3.5rem)] pb-8 px-0 flex justify-center overflow-y-auto custom-scroll scroll-smooth">
            <div class="w-full max-w-[800px] pt-6 animate-slide-up">
                <router-outlet></router-outlet>
                <!-- Localization Test -->
                <div style="display:none" id="localization-test">{{ 'shared.common.common.welcome' | translate }}</div>
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside
            class="hidden xl:block h-[calc(100vh-3.5rem)] overflow-y-auto pb-4 custom-scroll border-l border-border/10">
            <app-sidebar-right class="block animate-fade-in"></app-sidebar-right>
        </aside>
    </div>

    <!-- Mobile Menu Overlay -->
    <div *ngIf="layoutService.isMobileMenuOpen()" class="fixed inset-0 z-40 xl:hidden">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity"
            (click)="layoutService.closeMobileMenu()"></div>

        <!-- Menu Content -->
        <div
            class="absolute right-0 top-0 h-full w-[280px] bg-background shadow-2xl transform transition-transform duration-300 ease-in-out pt-16 px-4 overflow-y-auto">
            <div class="mb-4">
                <app-sidebar-left></app-sidebar-left>
            </div>
            <!-- Mobile Config/Profile Links could go here if separate from sidebar -->
        </div>
    </div>
</div>
