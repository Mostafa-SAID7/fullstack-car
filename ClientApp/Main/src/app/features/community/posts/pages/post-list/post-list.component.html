<div class="p-4 lg:p-8 max-w-[1600px] mx-auto animate-fade-in space-y-6">

    <!-- Card 1: Search & Actions -->
    <div class="bg-white dark:bg-[#111] rounded-[2.5rem] p-6 shadow-xl border border-black/5 dark:border-white/5">
        <form [formGroup]="searchForm" class="flex flex-col md:flex-row gap-4 mb-0">
            <!-- Search Input -->
            <div class="relative flex-grow group">
                <i
                    class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors duration-300"></i>
                <input formControlName="searchTerm" type="text" [placeholder]="'posts.searchPlaceholder' | translate"
                    class="w-full bg-secondary/30 dark:bg-white/5 border-2 border-transparent focus:border-primary/20 rounded-full pl-12 pr-6 py-4 outline-none transition-all text-foreground font-bold">
            </div>

            <!-- Filter Actions -->
            <div class="flex gap-2">
                <button type="button" (click)="toggleFilters()"
                    [ngClass]="showFilters ? 'bg-primary text-white' : 'bg-secondary dark:bg-white/5'"
                    class="px-8 py-4 rounded-full font-black uppercase text-xs tracking-widest hover:scale-105 active:scale-95 transition-all flex items-center gap-3 whitespace-nowrap">
                    <i class="fas fa-sliders-h"></i>
                    <span>{{ 'posts.filters' | translate }}</span>
                </button>

                <button type="button"
                    class="px-8 py-4 bg-primary text-white rounded-full font-black uppercase text-xs tracking-widest hover:scale-105 active:scale-95 transition-all shadow-lg shadow-primary/25 flex items-center gap-3 whitespace-nowrap">
                    <i class="fas fa-plus"></i>
                    <span>{{ 'posts.create' | translate }}</span>
                </button>
            </div>
        </form>

        <!-- Collapsible Filters -->
        <div *ngIf="showFilters" class="pt-6 animate-fade-in">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="flex flex-col">
                    <label
                        class="text-[10px] font-black text-primary uppercase tracking-[0.2em] mb-3 ml-4 opacity-70">{{ 'posts.sortBy' | translate }}</label>
                    <div class="relative">
                        <i
                            class="fas fa-sort absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        <select formControlName="sortBy"
                            class="w-full bg-secondary/30 dark:bg-white/5 border-none rounded-2xl pl-12 pr-6 py-4 outline-none transition-all text-sm font-bold cursor-pointer appearance-none">
                            <option value="createdAt">{{ 'posts.sortNewest' | translate }}</option>
                            <option value="views">{{ 'posts.sortMostViewed' | translate }}</option>
                            <option value="likes">{{ 'posts.sortMostLiked' | translate }}</option>
                        </select>
                        <i
                            class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Card 2: Content Grid -->
    <div
        class="bg-white dark:bg-[#111] rounded-[2.5rem] p-6 lg:p-8 shadow-xl border border-black/5 dark:border-white/5 min-h-[500px]">
        <!-- Loading -->
        <div *ngIf="loading" class="space-y-6">
            <div *ngFor="let i of [1,2,3]"
                class="p-5 bg-secondary/30 dark:bg-white/5 rounded-[2rem] animate-pulse space-y-4">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/10 rounded-2xl"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-3 bg-white/10 rounded-full w-1/4"></div>
                        <div class="h-2 bg-white/10 rounded-full w-1/6"></div>
                    </div>
                </div>
                <div class="h-4 bg-white/10 rounded-full w-full"></div>
                <div class="h-4 bg-white/10 rounded-full w-5/6"></div>
                <div class="h-64 bg-white/10 rounded-[2rem]"></div>
            </div>
        </div>

        <!-- Posts List -->
        <div *ngIf="!loading && posts.length > 0" class="space-y-6">
            <app-post-item *ngFor="let post of posts" [post]="post"></app-post-item>
        </div>

        <!-- Empty State -->
        <div *ngIf="!loading && posts.length === 0" class="py-24 text-center">
            <div
                class="w-20 h-20 bg-secondary/30 dark:bg-white/5 rounded-full flex items-center justify-center mx-auto mb-8">
                <i class="fas fa-cloud-moon text-3xl text-muted-foreground/30"></i>
            </div>
            <h3 class="text-xl font-black text-foreground uppercase tracking-widest mb-2">{{ 'posts.noPosts' | translate }}</h3>
            <p class="text-muted-foreground font-bold text-xs uppercase tracking-widest">{{ 'posts.beFirstToShare' | translate }}</p>
        </div>
    </div>

    <!-- Card 3: Pagination -->
    <div *ngIf="totalPages > 1"
        class="bg-white dark:bg-[#111] rounded-[2.5rem] p-6 shadow-xl border border-black/5 dark:border-white/5">
        <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize"
            [totalItems]="totalCount" (pageChange)="onPageChange($event)"></app-pagination>
    </div>

</div>
