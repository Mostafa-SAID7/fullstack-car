<div class="flex gap-3 overflow-x-auto pb-6 custom-scroll animate-fade-in">
    <!-- Create Story -->
    <div
        class="flex-shrink-0 w-32 h-52 rounded-2xl bg-card border border-border/40 overflow-hidden cursor-pointer relative group/story shadow-sm hover:shadow-primary/10 transition-all duration-300">
        <div class="h-3/5 overflow-hidden relative">
            <div
                class="w-full h-full bg-secondary/30 flex items-center justify-center transition-transform duration-700 group-hover/story:scale-110">
                <i class="fa-solid fa-plus text-3xl text-primary animate-pulse"></i>
            </div>
            <div
                class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover/story:opacity-100 transition-opacity">
            </div>
        </div>
        <div class="h-2/5 flex items-center justify-center relative p-2">
            <div
                class="absolute -top-5 w-10 h-10 rounded-full bg-primary border-4 border-background flex items-center justify-center text-white shadow-xl group-hover/story:scale-110 transition-transform">
                <i class="fa-solid fa-plus text-sm"></i>
            </div>
            <span class="text-[10px] font-black uppercase tracking-widest text-center mt-4">Create Story</span>
        </div>
    </div>

    <!-- Sample Stories -->
    <div *ngFor="let i of [1,2,3,4,5]"
        class="flex-shrink-0 w-32 h-52 rounded-2xl bg-card border border-border/40 overflow-hidden cursor-pointer relative group/item shadow-sm hover:shadow-xl transition-all duration-500">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400"
            class="w-full h-full object-cover group-hover/item:scale-110 transition-transform duration-1000" />
        <div
            class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 group-hover/item:from-black/60 transition-colors">
        </div>

        <!-- User Avatar with automotive glow -->
        <div
            class="absolute top-3 left-3 w-9 h-9 rounded-xl border border-primary/50 overflow-hidden shadow-lg shadow-primary/20 p-[1px] bg-primary/20 backdrop-blur-md transition-transform group-hover/item:scale-110">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100"
                class="w-full h-full object-cover rounded-lg" />
        </div>

        <div class="absolute bottom-3 left-3 flex flex-col gap-0.5">
            <span class="text-white text-[10px] font-black uppercase tracking-[0.1em] drop-shadow-md">User {{i}}</span>
            <span class="text-white/60 text-[8px] font-bold uppercase tracking-wider drop-shadow-md">2h ago</span>
        </div>
    </div>
</div>
