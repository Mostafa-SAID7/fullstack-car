<div class="video-list-container p-4 lg:p-8 max-w-7xl mx-auto">
  <!-- Header -->
  <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
    <div>
      <h1 class="text-4xl font-black text-slate-900 dark:text-white tracking-tighter uppercase italic">Video Broadcasts
      </h1>
      <p class="text-slate-500 font-bold text-xs uppercase tracking-widest mt-1">Explore automotive stories caught on
        camera</p>
    </div>
    <button (click)="navigateToUpload()"
      class="group h-14 px-8 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-[0.2em] text-xs hover:bg-blue-700 hover:shadow-2xl hover:shadow-blue-500/30 hover:-translate-y-1 active:translate-y-0 active:scale-95 transition-all flex items-center gap-3">
      <i class="fas fa-plus transition-transform group-hover:rotate-90"></i>
      New Upload
    </button>
  </div>

  <!-- Filters Panel -->
  <div
    class="bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 shadow-2xl shadow-slate-200/50 dark:shadow-black/50 border border-slate-100 dark:border-slate-800 mb-12">
    <form [formGroup]="searchForm" class="grid grid-cols-1 md:grid-cols-12 gap-6 items-end">
      <div class="md:col-span-6">
        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-1">Search
          Database</label>
        <div class="relative">
          <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input formControlName="searchTerm" type="text" placeholder="Keywords, models, or tags..."
            class="w-full bg-slate-50 dark:bg-slate-950 border-2 border-transparent focus:border-blue-500/20 rounded-2xl pl-12 pr-6 py-4 outline-none transition-all text-slate-900 dark:text-white font-bold">
        </div>
      </div>

      <div class="md:col-span-3">
        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-1">Filter
          Status</label>
        <select formControlName="status"
          class="w-full bg-slate-50 dark:bg-slate-950 border-2 border-transparent focus:border-blue-500/20 rounded-2xl px-5 py-4 outline-none transition-all text-slate-900 dark:text-white font-black cursor-pointer appearance-none">
          <option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label }}</option>
        </select>
      </div>

      <div class="md:col-span-3">
        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-1">Sort
          Preference</label>
        <div class="relative">
          <select (change)="onSortChange($event)"
            class="w-full bg-slate-50 dark:bg-slate-950 border-2 border-transparent focus:border-blue-500/20 rounded-2xl px-5 py-4 outline-none transition-all text-slate-900 dark:text-white font-black cursor-pointer appearance-none">
            <option *ngFor="let option of sortOptions" [value]="option.value + '|' + option.descending">{{ option.label
              }}</option>
          </select>
          <i
            class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
        </div>
      </div>
    </form>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="animate-pulse">
      <div class="aspect-video bg-slate-100 dark:bg-slate-800 rounded-3xl mb-4"></div>
      <div class="h-4 bg-slate-100 dark:bg-slate-800 rounded w-5/6 mb-2"></div>
      <div class="h-3 bg-slate-100 dark:bg-slate-800 rounded w-2/3"></div>
    </div>
  </div>

  <!-- Grid -->
  <div *ngIf="!loading && videos.length > 0"
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    <div *ngFor="let video of videos" class="hover-scale-wrapper">
      <app-media-card [media]="video" type="video" (play)="playVideo(video)" (like)="likeVideo(video)"
        (share)="shareVideo(video)"></app-media-card>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && videos.length === 0"
    class="flex flex-col items-center justify-center py-32 bg-slate-50 dark:bg-slate-950 rounded-[3rem] border-2 border-dashed border-slate-200 dark:border-slate-800">
    <div class="w-24 h-24 bg-white dark:bg-slate-900 rounded-full flex items-center justify-center shadow-xl mb-8">
      <i class="fas fa-video-slash text-3xl text-slate-300"></i>
    </div>
    <h3 class="text-2xl font-black text-slate-900 dark:text-white uppercase mb-2">No transmissions detected</h3>
    <p class="text-slate-500 font-bold text-xs uppercase tracking-widest mb-10">Expand your search criteria or
      contribute yours</p>
    <button (click)="clearFilters()"
      class="px-8 py-3 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-full font-black uppercase text-xs tracking-widest hover:scale-105 active:scale-95 transition-all">Clear
      Filters</button>
  </div>

  <!-- Pagination -->
  <div *ngIf="totalPages > 1" class="flex justify-center mt-20 gap-3">
    <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1"
      class="w-14 h-14 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 text-slate-500 hover:text-blue-600 hover:border-blue-500 disabled:opacity-20 transition-all shadow-sm">
      <i class="fas fa-arrow-left"></i>
    </button>

    <button *ngFor="let page of pages" (click)="onPageChange(page)" [ngClass]="{
        'bg-blue-600 text-white border-blue-600 shadow-blue-500/20 shadow-lg': page === currentPage,
        'bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 text-slate-500': page !== currentPage
      }"
      class="w-14 h-14 flex items-center justify-center rounded-2xl border hover:border-blue-200 transition-all font-black">
      {{ page }}
    </button>

    <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage === totalPages"
      class="w-14 h-14 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 text-slate-500 hover:text-blue-600 hover:border-blue-500 disabled:opacity-20 transition-all shadow-sm">
      <i class="fas fa-arrow-right"></i>
    </button>
  </div>
</div>
