version: '3.8'

services:
  ai-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
      - DATABASE_URL=sqlite:///./ai_agent.db
      - REDIS_URL=redis://redis:6379
      - COMMUNITY_CAR_API_URL=http://host.docker.internal:5000/api
    volumes:
      - ./models:/app/models
      - ./.env:/app/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: