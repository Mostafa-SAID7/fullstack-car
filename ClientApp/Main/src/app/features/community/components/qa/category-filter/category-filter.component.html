<div class="space-y-4">
  <h4 class="text-xs font-bold uppercase tracking-widest text-muted-foreground">Filter by Category</h4>
  
  <!-- Category Dropdown -->
  <div class="relative">
    <i class="fas fa-folder absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
    <select 
      [value]="selectedCategory"
      (change)="onCategoryChange($event)"
      class="w-full bg-secondary/30 dark:bg-white/5 border-none rounded-2xl pl-12 pr-12 py-4 outline-none transition-all text-sm font-bold cursor-pointer appearance-none">
      <option value="">All Categories</option>
      <option *ngFor="let category of categories" [value]="category.name">
        {{ category.name }} ({{ category.questionCount }})
      </option>
    </select>
    <i class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
  </div>

  <!-- Popular Categories -->
  <div class="space-y-3">
    <h5 class="text-xs font-bold uppercase tracking-widest text-muted-foreground opacity-70">Popular Categories</h5>
    <div class="flex flex-wrap gap-2">
      <button 
        *ngFor="let category of popularCategories"
        (click)="selectCategory(category.name)"
        [ngClass]="selectedCategory === category.name ? 'bg-primary text-white' : 'bg-secondary/50 dark:bg-white/5 hover:bg-secondary'"
        class="px-3 py-2 rounded-2xl font-bold text-xs uppercase tracking-widest transition-all flex items-center gap-2">
        <i class="fas fa-folder"></i>
        <span>{{ category.name }}</span>
        <span class="opacity-70">({{ category.questionCount }})</span>
      </button>
    </div>
  </div>
</div>
