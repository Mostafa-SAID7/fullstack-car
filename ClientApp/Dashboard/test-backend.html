<!DOCTYPE html>
<html>
<head>
    <title>Backend Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
    </style>
</head>
<body>
    <h1>Backend Integration Test</h1>
    <button onclick="runTests()">Run Tests</button>
    <div id="results"></div>

    <script>
        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="test">Running tests...</div>';

            const tests = [];

            // Test 1: Check if backend is reachable
            try {
                const response = await fetch('http://localhost:5101/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'test@test.com', password: 'test' })
                });
                
                if (response.status === 401 || response.status === 400) {
                    tests.push({ name: 'Backend Reachable', status: 'success', message: `Backend responding (${response.status})` });
                } else {
                    tests.push({ name: 'Backend Reachable', status: 'warning', message: `Unexpected status: ${response.status}` });
                }
            } catch (error) {
                tests.push({ name: 'Backend Reachable', status: 'error', message: `Cannot reach backend: ${error.message}` });
            }

            // Test 2: Check CORS
            try {
                const response = await fetch('http://localhost:5101/api/v4/shared/notifications', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.status === 401) {
                    tests.push({ name: 'CORS Configuration', status: 'success', message: 'CORS working (401 Unauthorized expected)' });
                } else {
                    tests.push({ name: 'CORS Configuration', status: 'warning', message: `Status: ${response.status}` });
                }
            } catch (error) {
                if (error.message.includes('CORS')) {
                    tests.push({ name: 'CORS Configuration', status: 'error', message: 'CORS blocked' });
                } else {
                    tests.push({ name: 'CORS Configuration', status: 'error', message: error.message });
                }
            }

            // Test 3: Check with valid credentials
            try {
                const loginResponse = await fetch('http://localhost:5101/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: 'admin@fully2car.com', 
                        password: 'Admin123!' 
                    })
                });
                
                const loginData = await loginResponse.json();
                
                if (loginResponse.ok && loginData.succeeded) {
                    tests.push({ name: 'Authentication', status: 'success', message: 'Login successful' });
                    
                    // Test authenticated request
                    const notifResponse = await fetch('http://localhost:5101/api/v4/shared/notifications', {
                        method: 'GET',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${loginData.data.token}`
                        }
                    });
                    
                    if (notifResponse.ok) {
                        tests.push({ name: 'Authenticated API', status: 'success', message: 'Authenticated request successful' });
                    } else {
                        tests.push({ name: 'Authenticated API', status: 'error', message: `Status: ${notifResponse.status}` });
                    }
                } else {
                    tests.push({ name: 'Authentication', status: 'error', message: loginData.message || 'Login failed' });
                }
            } catch (error) {
                tests.push({ name: 'Authentication', status: 'error', message: error.message });
            }

            // Display results
            results.innerHTML = tests.map(test => 
                `<div class="test ${test.status}">
                    <strong>${test.name}:</strong> ${test.message}
                </div>`
            ).join('');
        }
    </script>
</body>
</html>
