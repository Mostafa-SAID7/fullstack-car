<div class="video-player relative bg-black rounded-lg overflow-hidden" [class.fullscreen]="playbackState().fullscreen"
    (keydown)="handleKeyboardShortcut($event)" tabindex="0">
    <!-- Video Element -->
    <video #videoElement class="w-full h-full object-contain" [src]="currentSource()?.src"
        [autoplay]="config().autoplay" [muted]="config().muted" [loop]="config().loop" [preload]="config().preload"
        [controls]="false" (loadedmetadata)="onLoadedMetadata()" (timeupdate)="onTimeUpdate()" (play)="onPlay()"
        (pause)="onPause()" (ended)="onEnded()" (volumechange)="onVolumeChange()" (ratechange)="onRateChange()"
        (error)="onError($event)" (click)="togglePlayPause()">
        <!-- Video Sources -->
        <source *ngFor="let source of videoSources()" [src]="source.src" [type]="source.type">

        <!-- Text Tracks -->
        <track *ngFor="let track of videoTracks()" [kind]="track.kind" [src]="track.src" [srclang]="track.srclang"
            [label]="track.label" [default]="track.default">

        Your browser does not support the video tag.
    </video>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading()" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white"></div>
    </div>

    <!-- Controls Overlay -->
    <div class="controls-overlay absolute inset-0 flex flex-col justify-end opacity-0 hover:opacity-100 transition-opacity duration-300"
        [class.opacity-100]="showControls() || !playbackState().paused" (mousemove)="showControlsTemporarily()"
        (mouseleave)="hideControlsAfterDelay()">
        <!-- Center Play Button -->
        <div *ngIf="playbackState().paused && !isLoading()" class="absolute inset-0 flex items-center justify-center">
            <button (click)="play()"
                class="play-button bg-white bg-opacity-20 hover:bg-opacity-30 rounded-full p-4 transition-all duration-200"
                aria-label="Play video">
                <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                        clip-rule="evenodd"></path>
                </svg>
            </button>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container px-4 pb-2">
            <div class="progress-bar relative">
                <!-- Buffer Progress -->
                <div class="buffer-progress absolute inset-0 bg-white bg-opacity-30 rounded-full h-1">
                    <div class="buffer-fill bg-white bg-opacity-50 h-full rounded-full transition-all duration-200"
                        [style.width.%]="getBufferedPercentage()"></div>
                </div>

                <!-- Playback Progress -->
                <input type="range"
                    class="progress-input absolute inset-0 w-full h-1 bg-transparent appearance-none cursor-pointer"
                    [min]="0" [max]="playbackState().duration || 0" [value]="playbackState().currentTime"
                    (input)="seekTo($event)" (mousedown)="startSeeking()" (mouseup)="stopSeeking()"
                    aria-label="Video progress">
            </div>
        </div>

        <!-- Control Bar -->
        <div class="control-bar bg-gradient-to-t from-black to-transparent p-4">
            <div class="flex items-center justify-between">
                <!-- Left Controls -->
                <div class="flex items-center space-x-4">
                    <!-- Play/Pause Button -->
                    <button (click)="togglePlayPause()"
                        class="control-button text-white hover:text-gray-300 transition-colors"
                        [attr.aria-label]="playbackState().paused ? 'Play' : 'Pause'">
                        <svg *ngIf="playbackState().paused" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                                clip-rule="evenodd"></path>
                        </svg>
                        <svg *ngIf="!playbackState().paused" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </button>

                    <!-- Volume Control -->
                    <div class="volume-control flex items-center space-x-2">
                        <button (click)="toggleMute()"
                            class="control-button text-white hover:text-gray-300 transition-colors"
                            [attr.aria-label]="playbackState().muted ? 'Unmute' : 'Mute'">
                            <svg *ngIf="!playbackState().muted && playbackState().volume > 0.5" class="w-5 h-5"
                                fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd"
                                    d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.617.793L4.828 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.828l3.555-3.793A1 1 0 019.383 3.076zM12 6a1 1 0 011.414 0L15 7.586l1.586-1.586A1 1 0 1118 7.414L16.414 9 18 10.586A1 1 0 0116.586 12L15 10.414 13.414 12A1 1 0 0112 10.586L13.586 9 12 7.414A1 1 0 0112 6z"
                                    clip-rule="evenodd"></path>
                            </svg>
                            <svg *ngIf="!playbackState().muted && playbackState().volume <= 0.5 && playbackState().volume > 0"
                                class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd"
                                    d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.617.793L4.828 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.828l3.555-3.793A1 1 0 019.383 3.076zM12.293 7.293a1 1 0 011.414 0L15 8.586l1.293-1.293a1 1 0 111.414 1.414L16.414 10l1.293 1.293a1 1 0 01-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 01-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 010-1.414z"
                                    clip-rule="evenodd"></path>
                            </svg>
                            <svg *ngIf="playbackState().muted || playbackState().volume === 0" class="w-5 h-5"
                                fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd"
                                    d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.617.793L4.828 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.828l3.555-3.793A1 1 0 019.383 3.076zM12.293 7.293a1 1 0 011.414 0L15 8.586l1.293-1.293a1 1 0 111.414 1.414L16.414 10l1.293 1.293a1 1 0 01-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 01-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 010-1.414z"
                                    clip-rule="evenodd"></path>
                            </svg>
                        </button>

                        <input type="range"
                            class="volume-slider w-20 h-1 bg-white bg-opacity-30 rounded-full appearance-none cursor-pointer"
                            [min]="0" [max]="1" [step]="0.1" [value]="playbackState().volume"
                            (input)="setVolume($event)" aria-label="Volume">
                    </div>

                    <!-- Time Display -->
                    <div class="time-display text-white text-sm font-mono">
                        {{ formatTime(playbackState().currentTime) }} / {{ formatTime(playbackState().duration) }}
                    </div>
                </div>

                <!-- Right Controls -->
                <div class="flex items-center space-x-4">
                    <!-- Playback Rate -->
                    <div class="playback-rate relative" *ngIf="config().playbackRates.length > 1">
                        <button (click)="togglePlaybackRateMenu()"
                            class="control-button text-white hover:text-gray-300 transition-colors text-sm"
                            aria-label="Playback speed">
                            {{ playbackState().playbackRate }}x
                        </button>

                        <div *ngIf="showPlaybackRateMenu()"
                            class="playback-rate-menu absolute bottom-full right-0 mb-2 bg-black bg-opacity-90 rounded-lg p-2 min-w-20">
                            <button *ngFor="let rate of config().playbackRates" (click)="setPlaybackRate(rate)"
                                class="block w-full text-left px-3 py-1 text-white hover:bg-white hover:bg-opacity-20 rounded text-sm"
                                [class.bg-white]="playbackState().playbackRate === rate"
                                [class.bg-opacity-20]="playbackState().playbackRate === rate">
                                {{ rate }}x
                            </button>
                        </div>
                    </div>

                    <!-- Quality Selector -->
                    <div class="quality-selector relative"
                        *ngIf="config().enableQualitySelector && videoSources().length > 1">
                        <button (click)="toggleQualityMenu()"
                            class="control-button text-white hover:text-gray-300 transition-colors text-sm"
                            aria-label="Video quality">
                            {{ currentSource()?.quality || 'Auto' }}
                        </button>

                        <div *ngIf="showQualityMenu()"
                            class="quality-menu absolute bottom-full right-0 mb-2 bg-black bg-opacity-90 rounded-lg p-2 min-w-20">
                            <button *ngFor="let source of videoSources()" (click)="setQuality(source)"
                                class="block w-full text-left px-3 py-1 text-white hover:bg-white hover:bg-opacity-20 rounded text-sm"
                                [class.bg-white]="currentSource()?.quality === source.quality"
                                [class.bg-opacity-20]="currentSource()?.quality === source.quality">
                                {{ source.quality }}
                            </button>
                        </div>
                    </div>

                    <!-- Subtitles -->
                    <button *ngIf="config().enableSubtitles && videoTracks().length > 0" (click)="toggleSubtitles()"
                        class="control-button text-white hover:text-gray-300 transition-colors"
                        [class.text-blue-400]="subtitlesEnabled()" aria-label="Toggle subtitles">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M7 4V2a1 1 0 011-1h4a1 1 0 011 1v2h4a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V5a1 1 0 011-1h4zm2-1v1h2V3H9zM6 6H4v8h12V6H6z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </button>

                    <!-- Picture in Picture -->
                    <button *ngIf="config().enablePictureInPicture && supportsPiP()" (click)="togglePictureInPicture()"
                        class="control-button text-white hover:text-gray-300 transition-colors"
                        [class.text-blue-400]="playbackState().pictureInPicture" aria-label="Picture in picture">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M2 3a1 1 0 011-1h14a1 1 0 011 1v11a1 1 0 01-1 1H3a1 1 0 01-1-1V3zm2 2v7h12V5H4zm8 8a1 1 0 011-1h3a1 1 0 011 1v2a1 1 0 01-1 1h-3a1 1 0 01-1-1v-2z">
                            </path>
                        </svg>
                    </button>

                    <!-- Fullscreen -->
                    <button *ngIf="config().enableFullscreen" (click)="toggleFullscreen()"
                        class="control-button text-white hover:text-gray-300 transition-colors"
                        [attr.aria-label]="playbackState().fullscreen ? 'Exit fullscreen' : 'Enter fullscreen'">
                        <svg *ngIf="!playbackState().fullscreen" class="w-5 h-5" fill="currentColor"
                            viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M3 4a1 1 0 011-1h4a1 1 0 010 2H6.414l2.293 2.293a1 1 0 11-1.414 1.414L5 6.414V8a1 1 0 01-2 0V4zm9 1a1 1 0 010-2h4a1 1 0 011 1v4a1 1 0 01-2 0V6.414l-2.293 2.293a1 1 0 11-1.414-1.414L13.586 5H12zm-9 7a1 1 0 012 0v1.586l2.293-2.293a1 1 0 111.414 1.414L6.414 15H8a1 1 0 010 2H4a1 1 0 01-1-1v-4zm13-1a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 010-2h1.586l-2.293-2.293a1 1 0 111.414-1.414L15 13.586V12a1 1 0 011-1z"
                                clip-rule="evenodd"></path>
                        </svg>
                        <svg *ngIf="playbackState().fullscreen" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M8 2a1 1 0 000 2H6.414l1.293 1.293a1 1 0 11-1.414 1.414L5 5.414V7a1 1 0 01-2 0V3a1 1 0 011-1h4zm4 0a1 1 0 011 1v4a1 1 0 01-2 0V5.414l-1.293 1.293a1 1 0 11-1.414-1.414L9.586 4H8a1 1 0 010-2h4zM2 12a1 1 0 011-1h4a1 1 0 010 2H5.414l1.293 1.293a1 1 0 11-1.414 1.414L4 14.414V16a1 1 0 01-2 0v-4zm11 1a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-2 0v-1.586l-1.293 1.293a1 1 0 11-1.414-1.414L16.586 15H15a1 1 0 01-1-1z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="hasError()" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-75">
        <div class="text-center text-white p-6">
            <svg class="w-12 h-12 mx-auto mb-4 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                    clip-rule="evenodd"></path>
            </svg>
            <h3 class="text-lg font-semibold mb-2">Video Error</h3>
            <p class="text-sm text-gray-300">{{ errorMessage() }}</p>
            <button (click)="retry()"
                class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                Retry
            </button>
        </div>
    </div>
</div>
