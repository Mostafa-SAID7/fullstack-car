<app-auth-layout title="Welcome Back" subtitle="Sign in to continue to Fully2Car">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email Input -->
        <app-form-input [formControl]="emailControl" type="email" label="Email Address" placeholder="Enter your email"
            prefixIcon="fa-envelope" [required]="true">
        </app-form-input>

        <!-- Password Input -->
        <app-form-input [formControl]="passwordControl" type="password" label="Password"
            placeholder="Enter your password" prefixIcon="fa-lock" [showToggle]="true" [required]="true">
        </app-form-input>

        <!-- Remember Me & Forgot Password -->
        <div class="login-options">
            <label class="checkbox-container">
                <input type="checkbox" formControlName="rememberMe" />
                <span>Remember me</span>
            </label>

            <a routerLink="/auth/forgot-password" class="forgot-link">
                Forgot password?
            </a>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="error-alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}
        </div>

        <!-- Submit Button -->
        <app-form-button type="submit" variant="primary" size="lg" [loading]="loading" [disabled]="loginForm.invalid"
            [fullWidth]="true">
            Sign In
        </app-form-button>

        <!-- Divider -->
        <div class="divider">
            <span>Or continue with</span>
        </div>

        <!-- OAuth Buttons -->
        <div class="oauth-buttons">
            <app-oauth-button provider="google" (clicked)="loginWithGoogle()"></app-oauth-button>
            <app-oauth-button provider="github" (clicked)="loginWithGitHub()"></app-oauth-button>
            <app-oauth-button provider="facebook" (clicked)="loginWithFacebook()"></app-oauth-button>
        </div>
    </form>

    <!-- Footer -->
    <div footer class="auth-footer">
        <p>
            Don't have an account?
            <a routerLink="/auth/register" class="link-primary">Sign up</a>
        </p>
    </div>
</app-auth-layout>
