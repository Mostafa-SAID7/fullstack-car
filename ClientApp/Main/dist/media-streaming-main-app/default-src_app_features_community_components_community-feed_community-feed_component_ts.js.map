<div class="space-y-8">
    <!-- Skeleton Loader -->
    <div *ngIf="loading" class="fb-card p-5 animate-pulse space-y-4 mb-6 border-primary/5">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-secondary rounded-xl"></div>
            <div class="flex-1 space-y-2">
                <div class="h-3 bg-secondary rounded-lg w-1/4"></div>
                <div class="h-2 bg-secondary rounded-lg w-1/6"></div>
            </div>
        </div>
        <div class="space-y-3 pt-2">
            <div class="h-3 bg-secondary rounded-lg w-full"></div>
            <div class="h-3 bg-secondary rounded-lg w-5/6"></div>
        </div>
        <div class="h-64 bg-secondary/50 rounded-2xl mt-4"></div>
    </div>

    <app-post-item *ngFor="let post of posts" [post]="post"></app-post-item>

    <div *ngIf="!loading && posts.length === 0"
        class="flex flex-col items-center justify-center py-20 mica-effect rounded-3xl border border-primary/5 mx-4 animate-in">
        <div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center text-primary mb-4">
            <i class="fa-solid fa-cloud-moon text-2xl"></i>
        </div>
        <span class="text-[10px] font-black uppercase tracking-widest text-muted-foreground/60">No posts available</span>
    </div>
</div>
