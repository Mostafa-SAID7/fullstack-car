<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Community Car - Main</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Font Preloading for CLS Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
  
  <!-- Font Awesome with optimized loading -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></noscript>
  
  <!-- Font Fallback CSS to prevent CLS -->
  <style>
    /* Font fallbacks to prevent layout shift during font loading */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    
    /* Ensure consistent sizing during font swap */
    .font-inter-loading {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 1.05em;
      letter-spacing: 0.01em;
    }
    
    /* Prevent invisible text during font load */
    @font-face {
      font-family: 'Inter';
      font-display: swap;
    }
    
    /* Critical CSS for above-the-fold content */
    .cls-optimized-container {
      position: relative;
      width: 100%;
    }
    
    .skeleton-element {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 0.25rem;
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      .skeleton-element {
        animation: none;
        background: #f0f0f0;
      }
    }
  </style>
</head>

<body class="bg-background text-foreground transition-colors duration-300">
  <app-root></app-root>
</body>

</html>
