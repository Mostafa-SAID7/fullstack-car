<!-- Modern Login Page (Themed) -->
<div class="min-h-screen bg-background flex items-center justify-center p-4 animate-fade-in relative overflow-hidden">

  <!-- Subtle Background Decorations (Optional) -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-500/5 rounded-full blur-[100px]"></div>
  </div>

  <!-- Main Card -->
  <div
    class="w-full max-w-md bg-white dark:bg-[#111] border border-black/5 dark:border-white/10 shadow-xl dark:shadow-2xl rounded-2xl p-6 sm:p-8 relative z-10 animate-scale-in">

    <!-- Logo & Header -->
    <div class="text-center mb-8">
      <div
        class="w-16 h-16 sm:w-20 sm:h-20 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-primary/20 rotate-3 hover:rotate-6 transition-transform duration-500">
        <span class="text-white font-black text-3xl tracking-tighter italic">CC</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-foreground mb-2 tracking-tight">Welcome Back</h1>
      <p class="text-muted-foreground font-medium text-sm sm:text-base">Sign in to continue to Community Car</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Error Message -->
      <div *ngIf="error"
        class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 flex items-start gap-3 text-sm animate-shake">
        <i class="fa-solid fa-circle-exclamation mt-0.5 text-lg"></i>
        <p class="font-medium leading-tight">{{ error }}</p>
      </div>

      <!-- Email Input -->
      <div class="space-y-1.5">
        <label for="email" class="text-xs font-bold uppercase tracking-widest text-muted-foreground ml-1">Email
          Address</label>
        <div class="relative group">
          <i
            class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground/50 group-focus-within:text-primary transition-colors"></i>
          <input id="email" type="email" formControlName="email" placeholder="name@example.com"
            class="w-full pl-11 pr-4 py-3.5 bg-secondary/30 border border-transparent dark:border-white/5 data-[state=error]:border-red-500/50 rounded-xl text-foreground placeholder:text-muted-foreground/50 focus:bg-background focus:border-primary/50 focus:ring-4 focus:ring-primary/10 outline-none transition-all duration-200 text-sm font-medium shadow-inner"
            [class.!border-red-500]="emailControl.invalid && emailControl.touched">
        </div>
        <div *ngIf="emailControl.invalid && emailControl.touched"
          class="text-xs text-red-500 font-bold ml-1 animate-slide-down">
          <span *ngIf="emailControl.errors?.['required']">Email is required</span>
          <span *ngIf="emailControl.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <!-- Password Input -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center px-1">
          <label for="password"
            class="text-xs font-bold uppercase tracking-widest text-muted-foreground">Password</label>
          <a routerLink="/auth/forgot-password" class="text-xs font-bold text-primary hover:underline cursor-pointer">
            Forgot password?
          </a>
        </div>
        <div class="relative group">
          <i
            class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground/50 group-focus-within:text-primary transition-colors"></i>
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="••••••••"
            class="w-full pl-11 pr-11 py-3.5 bg-secondary/30 border border-transparent dark:border-white/5 rounded-xl text-foreground placeholder:text-muted-foreground/50 focus:bg-background focus:border-primary/50 focus:ring-4 focus:ring-primary/10 outline-none transition-all duration-200 text-sm font-medium shadow-inner"
            [class.!border-red-500]="passwordControl.invalid && passwordControl.touched">
          <button type="button" (click)="showPassword = !showPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-secondary/50 text-muted-foreground hover:text-foreground transition-colors">
            <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="passwordControl.invalid && passwordControl.touched"
          class="text-xs text-red-500 font-bold ml-1 animate-slide-down">
          <span *ngIf="passwordControl.errors?.['required']">Password is required</span>
          <span *ngIf="passwordControl.errors?.['minlength']">Password too short (min 6 chars)</span>
        </div>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center ml-1">
        <label class="relative flex items-center cursor-pointer gap-3">
          <input type="checkbox" formControlName="rememberMe" class="peer sr-only">
          <div
            class="w-5 h-5 border-2 border-muted-foreground/30 rounded-md peer-checked:bg-primary peer-checked:border-primary transition-all flex items-center justify-center">
            <i
              class="fa-solid fa-check text-[10px] text-white opacity-0 peer-checked:opacity-100 transition-opacity"></i>
          </div>
          <span class="text-sm font-semibold text-muted-foreground select-none">Remember me</span>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loginForm.invalid || loading"
        class="w-full py-3.5 px-4 bg-primary text-white text-sm font-black uppercase tracking-widest rounded-xl shadow-lg shadow-primary/25 hover:shadow-primary/40 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 transition-all duration-300 flex items-center justify-center gap-2 mt-4">
        <span *ngIf="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Signing In...</span>
        <span *ngIf="!loading">Sign In</span>
      </button>

      <!-- Divider -->
      <div class="relative py-4">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-border/40"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="px-4 bg-white dark:bg-[#111] text-xs font-bold text-muted-foreground uppercase tracking-widest">
            New Here?
          </span>
        </div>
      </div>

      <!-- Register Link -->
      <a routerLink="/auth/register" class="block">
        <button type="button"
          class="w-full py-3.5 px-4 bg-secondary/50 border border-border/50 text-foreground text-sm font-bold rounded-xl hover:bg-secondary hover:border-border transition-all duration-300">
          Create a new account
        </button>
      </a>

    </form>

    <!-- Footer -->
    <div class="mt-8 text-center border-t border-border/30 pt-4">
      <p class="text-[10px] font-bold text-muted-foreground/40 uppercase tracking-widest">
        © 2024 Community Car. All rights reserved.
      </p>
    </div>

  </div>
</div>
