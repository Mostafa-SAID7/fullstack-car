<div class="relative">
    <button #triggerElement type="button" [class]="triggerClasses()" [disabled]="disabled()" [id]="selectId()"
        [attr.aria-expanded]="isOpen()" [attr.aria-haspopup]="'listbox'" [attr.aria-labelledby]="ariaLabelledBy()"
        [attr.aria-describedby]="ariaDescribedBy()" [attr.aria-invalid]="isInvalid()" [attr.aria-required]="required()"
        role="combobox" (click)="toggleDropdown()" (blur)="onBlur()" (keydown)="onTriggerKeyDown($event)">
        <span class="block truncate text-left">
            @if (selectedOption()) {
            {{ selectedOption()!.label }}
            } @else {
            <span class="text-muted-foreground">{{ placeholder() }}</span>
            }
        </span>
        <span class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2">
            <svg class="h-4 w-4 text-muted-foreground transition-transform duration-200" [class.rotate-180]="isOpen()"
                fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </span>
    </button>

    @if (isOpen()) {
    <div class="absolute z-50 mt-1 w-full rounded-md border border-input bg-popover shadow-lg" role="listbox"
        [attr.aria-labelledby]="selectId()">
        <div class="max-h-60 overflow-auto rounded-md py-1">
            @for (option of options(); track option.value; let i = $index) {
            <button type="button" [class]="optionClasses(option, i)" [disabled]="option.disabled" [id]="getOptionId(i)"
                [attr.aria-selected]="isSelected(option)"
                [attr.aria-describedby]="option.description ? getOptionDescriptionId(i) : null" role="option"
                (click)="selectOption(option)" (mouseenter)="setFocusedIndex(i)">
                <span class="block truncate">{{ option.label }}</span>
                @if (option.description) {
                <span [id]="getOptionDescriptionId(i)" class="block text-xs text-muted-foreground truncate">
                    {{ option.description }}
                </span>
                }
                @if (isSelected(option)) {
                <span class="absolute inset-y-0 right-0 flex items-center pr-3">
                    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                            clip-rule="evenodd"></path>
                    </svg>
                </span>
                }
            </button>
            } @empty {
            <div class="px-3 py-2 text-sm text-muted-foreground">No options available</div>
            }
        </div>
    </div>
    }
</div>
