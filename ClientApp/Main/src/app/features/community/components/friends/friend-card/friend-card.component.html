<div class="fb-card p-4 flex items-center justify-between hover:bg-secondary/10 transition-colors group/friend">
    <div class="flex items-center gap-3">
        <div class="relative">
            <div
                class="w-12 h-12 rounded-xl bg-gradient-to-tr from-primary/10 to-primary/5 border border-primary/10 overflow-hidden shadow-sm">
                <img *ngIf="friend.profileImageUrl" [src]="friend.profileImageUrl" class="w-full h-full object-cover">
                <div *ngIf="!friend.profileImageUrl"
                    class="w-full h-full flex items-center justify-center font-black text-primary">
                    {{ friend.firstName[0] }}{{ friend.lastName[0] }}
                </div>
            </div>
            <div
                class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-background bg-emerald-500 shadow-sm"
                [title]="'status.online' | translate">
            </div>
        </div>
        <div>
            <h4 class="text-sm font-black group-hover/friend:text-primary transition-colors">{{ friend.firstName }} {{
                friend.lastName }}</h4>
            <span class="text-[10px] font-black text-muted-foreground/60 uppercase tracking-widest">
                {{ 'friends.friendsSince' | translate: { date: (friend.friendsSince | date:'MMM yyyy') } }}
            </span>
        </div>
    </div>
    <div class="flex gap-2">
        <button (click)="sendMessage()"
            class="w-8 h-8 rounded-lg hover:bg-primary/5 flex items-center justify-center text-muted-foreground/60 hover:text-primary transition-all"
            [title]="'messaging.sendMessage' | translate">
            <i class="fa-solid fa-comment-dots text-xs"></i>
        </button>
        <button (click)="removeFriend()"
            class="w-8 h-8 rounded-lg hover:bg-red-500/5 flex items-center justify-center text-muted-foreground/60 hover:text-red-500 transition-all opacity-0 group-hover/friend:opacity-100"
            [title]="'friends.removeFriend' | translate">
            <i class="fa-solid fa-user-minus text-xs"></i>
        </button>
    </div>
</div>
