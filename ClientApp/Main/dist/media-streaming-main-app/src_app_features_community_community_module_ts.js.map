<div class="guides-list-container">
  <!-- Header -->
  <div class="header">
    <div class="header__content">
      <h1>Community Guides</h1>
      <p>Learn from the community's expertise</p>
    </div>
    <button class="btn btn-primary" routerLink="/community/guides/create">
      <i class="fa-solid fa-plus"></i>
      Create Guide
    </button>
  </div>

  <!-- List View with Filters -->
  <app-list-view [items]="guides" [loading]="loading" [error]="error" [pagination]="paginationConfig"
    [config]="{ showPagination: true, gridCols: 3, gap: '24px' }" (pageChange)="onPageChange($event)"
    emptyMessage="No guides found" emptyDescription="Try adjusting your filters or create a new guide">

    <!-- Filters Section -->
    <div filters class="filters-panel">
      <div class="filters-grid">
        <!-- Search -->
        <div class="filter-item filter-item--wide">
          <label>Search</label>
          <input type="text" [(ngModel)]="searchTerm" (input)="onSearchChange()" placeholder="Search guides..."
            class="input" />
        </div>

        <!-- Category -->
        <div class="filter-item">
          <label>Category</label>
          <select [(ngModel)]="selectedCategory" (change)="onCategoryChange()" class="select">
            <option [value]="undefined">All Categories</option>
            <option *ngFor="let category of categories" [ngValue]="category.value">
              {{ category.name }}
            </option>
          </select>
        </div>

        <!-- Difficulty -->
        <div class="filter-item">
          <label>Difficulty</label>
          <select [(ngModel)]="selectedDifficulty" (change)="onDifficultyChange()" class="select">
            <option [value]="undefined">All Levels</option>
            <option *ngFor="let difficulty of difficulties" [ngValue]="difficulty.value">
              {{ difficulty.name }}
            </option>
          </select>
        </div>

        <!-- Sort -->
        <div class="filter-item">
          <label>Sort By</label>
          <select [(ngModel)]="filters.sortBy" (change)="onSortChange(filters.sortBy!)" class="select">
            <option *ngFor="let option of sortOptions" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </div>
      </div>

      <!-- Additional Filters -->
      <div class="filters-footer">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="showFeaturedOnly" (change)="onFeaturedToggle()" />
          <span>Featured only</span>
        </label>

        <button (click)="clearFilters()" class="btn-link">
          Clear Filters
        </button>
      </div>
    </div>

    <!-- Guide Card Template -->
    <ng-template #itemTemplate let-guide>
      <app-guide-card [guide]="guide" (bookmarkClick)="onBookmarkGuide($event)"></app-guide-card>
    </ng-template>
  </app-list-view>
</div>
