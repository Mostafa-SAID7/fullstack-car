<div [class]="containerClasses">
  <!-- Spinner Variant -->
  @if (variant === 'spinner') {
    <div>
      <svg 
        [class]="iconClasses + ' animate-spin'" 
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </div>
  }

  <!-- Dots Variant -->
  @if (variant === 'dots') {
    <div class="flex space-x-1">
      @for (dot of [0,1,2]; track $index) {
        <div 
          [class]="dotSize + ' bg-blue-600 rounded-full animate-bounce'"
          [style.animation-delay]="($index * 0.2) + 's'">
        </div>
      }
    </div>
  }

  <!-- Pulse Variant -->
  @if (variant === 'pulse') {
    <div>
      <div [class]="iconClasses + ' bg-blue-600 rounded-full animate-pulse'"></div>
    </div>
  }

  <!-- Bars Variant -->
  @if (variant === 'bars') {
    <div class="flex space-x-1 items-end">
      @for (bar of [0,1,2,3]; track $index) {
        <div 
          [class]="barWidth + ' bg-blue-600 rounded-sm animate-pulse'"
          [style.height]="barHeight"
          [style.animation-delay]="($index * 0.1) + 's'">
        </div>
      }
    </div>
  }

  <!-- Loading Text -->
  @if (text) {
    <p [class]="textClasses">
      {{ text }}
    </p>
  }
</div>
