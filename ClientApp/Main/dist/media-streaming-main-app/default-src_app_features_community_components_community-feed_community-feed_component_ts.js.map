<div class="fb-card border-primary/5 group/post animate-fade-in shadow-xl shadow-primary/5">
    <div class="p-4 pb-2 flex items-center justify-between">
        <div class="flex gap-3">
            <div
                class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary/10 to-primary/5 border border-primary/10 flex items-center justify-center font-black text-primary overflow-hidden shadow-sm">
                <img *ngIf="post.userProfileImageUrl" [src]="post.userProfileImageUrl"
                    class="w-full h-full object-cover">
                <span *ngIf="!post.userProfileImageUrl" class="text-xs">{{ post.userFirstName[0] }}{{
                    post.userLastName[0] }}</span>
            </div>
            <div>
                <h4 class="text-sm font-black hover:text-primary cursor-pointer transition-colors">{{ post.userFirstName
                    }} {{
                    post.userLastName }}</h4>
                <div
                    class="flex items-center gap-1 text-[10px] font-black text-muted-foreground/60 uppercase tracking-widest">
                    <span>{{ post.createdAt | date:'short' }}</span> • <i
                        class="fa-solid fa-earth-africa opacity-70"></i>
                </div>
            </div>
        </div>
        <button
            class="w-9 h-9 rounded-xl hover:bg-primary/5 flex items-center justify-center text-muted-foreground/60 hover:text-primary transition-all">
            <i class="fa-solid fa-ellipsis"></i>
        </button>
    </div>
    <div class="px-5 py-2 font-black text-lg tracking-tight" *ngIf="post.title">{{ post.title }}</div>
    <div class="px-5 py-3 text-[15px] leading-relaxed font-medium text-foreground/80">
        {{ post.content }}
    </div>
    <div *ngIf="post.imageUrl"
        class="relative bg-secondary/20 h-[480px] flex items-center justify-center overflow-hidden cursor-pointer group/image">
        <img [src]="post.imageUrl"
            class="w-full h-full object-cover transition-transform duration-1000 group-hover/image:scale-105">
        <div
            class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent opacity-0 group-hover/image:opacity-100 transition-opacity duration-500">
        </div>
        <div
            class="absolute bottom-4 right-4 mica-effect text-white text-[10px] font-black px-4 py-2 rounded-xl uppercase tracking-widest shadow-2xl scale-90 group-hover/image:scale-100 transition-transform duration-500">
            Performance View
        </div>
    </div>
    <div class="px-4 py-3">
        <div
            class="flex items-center justify-between text-[10px] font-black uppercase tracking-widest text-muted-foreground/60 border-b border-border/20 pb-5 mb-4">
            <div class="flex items-center -space-x-2">
                <span
                    class="flex items-center justify-center w-7 h-7 bg-primary rounded-lg text-white border-2 border-background z-20 shadow-lg shadow-primary/20 overflow-hidden">
                    <i class="fa-solid fa-thumbs-up text-[10px]"></i>
                </span>
                <span class="ml-4 font-black text-foreground/70">{{ post.likesCount }} likes</span>
            </div>
            <div class="hover:text-primary cursor-pointer transition-colors">{{ post.commentsCount }} comments</div>
        </div>
        <div class="flex gap-4 py-1">
            <button (click)="toggleLike()" [class.text-primary]="isLiked"
                class="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl hover:bg-primary/5 transition-all text-[11px] font-black uppercase tracking-widest text-foreground/70 hover:text-primary group/like">
                <i class="fa-solid fa-thumbs-up scale-110 group-hover/like:rotate-[-10deg] transition-transform"
                    [class.fa-bounce]="isLiked"></i>
                Like
            </button>
            <button (click)="toggleComments()"
                class="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl hover:bg-primary/5 transition-all text-[11px] font-black uppercase tracking-widest text-foreground/70 hover:text-primary group/comment">
                <i class="fa-solid fa-comment scale-110 group-hover/comment:scale-125 transition-transform"></i>
                Comment
            </button>
            <button
                class="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl hover:bg-primary/5 transition-all text-[11px] font-black uppercase tracking-widest text-foreground/70 hover:text-primary group/share">
                <i class="fa-solid fa-share scale-110 group-hover/share:translate-x-1 transition-transform"></i>
                Share
            </button>
        </div>
    </div>
</div>
