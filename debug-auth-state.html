<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Auth State</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .status { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Authentication Debug</h1>
        
        <div class="section info">
            <h3>Test Credentials</h3>
            <p><strong>Email:</strong> admin@fully2car.com</p>
            <p><strong>Password:</strong> Admin123!</p>
        </div>

        <div class="section">
            <h3>Authentication Test</h3>
            <button onclick="testLogin()">Test Login</button>
            <button onclick="checkAuthState()">Check Auth State</button>
            <button onclick="clearAuth()">Clear Auth</button>
            <button onclick="testDashboardAccess()">Test Dashboard Access</button>
        </div>

        <div class="section">
            <h3>Results</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5100/api';
        const DASHBOARD_URL = 'http://localhost:3018';

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `section ${type}`;
            div.innerHTML = `<pre>${message}</pre>`;
            results.appendChild(div);
            console.log(message);
        }

        async function testLogin() {
            log('🔍 Testing Login Flow...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@fully2car.com',
                        password: 'Admin123!',
                        rememberMe: true
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.succeeded) {
                    log('✅ Backend Login: SUCCESS', 'success');
                    log(`Token: ${data.data.token.substring(0, 50)}...`, 'info');
                    log(`User: ${data.data.user.firstName} ${data.data.user.lastName} (${data.data.user.email})`, 'info');
                    
                    // Simulate what the Dashboard auth service should do
                    localStorage.setItem('auth_token', data.data.token);
                    localStorage.setItem('auth_user', JSON.stringify({
                        id: data.data.user.id,
                        firstName: data.data.user.firstName,
                        lastName: data.data.user.lastName,
                        email: data.data.user.email,
                        name: `${data.data.user.firstName} ${data.data.user.lastName}`,
                        roles: data.data.user.roles,
                        isActive: data.data.user.isActive,
                        isEmailConfirmed: data.data.user.isEmailConfirmed,
                        createdAt: data.data.user.createdAt
                    }));
                    
                    log('✅ Local Storage Updated', 'success');
                } else {
                    log('❌ Backend Login: FAILED', 'error');
                    log(`Error: ${data.message || data.errors?.join(', ') || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                log(`❌ Login Error: ${error.message}`, 'error');
            }
        }

        function checkAuthState() {
            log('🔍 Checking Authentication State...', 'info');
            
            const token = localStorage.getItem('auth_token');
            const user = localStorage.getItem('auth_user');
            
            if (token && user) {
                log('✅ Authentication Data Found', 'success');
                log(`Token: ${token.substring(0, 50)}...`, 'info');
                
                try {
                    const userData = JSON.parse(user);
                    log(`User: ${userData.name} (${userData.email})`, 'info');
                    log(`Roles: ${userData.roles.join(', ')}`, 'info');
                    log(`Active: ${userData.isActive}`, 'info');
                } catch (e) {
                    log('❌ Invalid user data in localStorage', 'error');
                }
            } else {
                log('❌ No Authentication Data Found', 'error');
                log(`Token exists: ${!!token}`, 'info');
                log(`User exists: ${!!user}`, 'info');
            }
        }

        function clearAuth() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');
            log('🗑️ Authentication data cleared', 'info');
        }

        async function testDashboardAccess() {
            log('🔍 Testing Dashboard Access...', 'info');
            
            try {
                // Test if we can access the dashboard
                const response = await fetch(`${DASHBOARD_URL}/dashboard`);
                log(`Dashboard Response: ${response.status}`, response.ok ? 'success' : 'error');
                
                // Test if we can access a protected API endpoint
                const token = localStorage.getItem('auth_token');
                if (token) {
                    const apiResponse = await fetch(`${API_BASE_URL}/v7/media/videos/analytics`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    log(`Protected API Response: ${apiResponse.status}`, apiResponse.ok ? 'success' : 'error');
                } else {
                    log('❌ No token available for API test', 'error');
                }
            } catch (error) {
                log(`❌ Dashboard Access Error: ${error.message}`, 'error');
            }
        }

        // Auto-check auth state on load
        window.onload = () => {
            checkAuthState();
        };
    </script>
</body>
</html>
