<!-- Mobile Bottom Navigation -->
<nav
    class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 z-50 md:hidden">
    <div class="grid grid-cols-5 h-16">
        @for (item of items(); track item.id; let index = $index) {
        <a [routerLink]="item.href" routerLinkActive="text-primary bg-primary/10" (click)="onItemClick(item, index)"
            class="flex flex-col items-center justify-center space-y-1 text-gray-600 dark:text-gray-400 hover:text-primary transition-colors touch-manipulation"
            [class.text-primary]="item.active" [attr.aria-label]="item.label">

            <div class="relative">
                <i [class]="item.icon + ' text-xl'"></i>
                @if (item.badge) {
                <span
                    class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full min-w-5 h-5 flex items-center justify-center px-1">
                    {{ item.badge }}
                </span>
                }
            </div>

            <span class="text-xs font-medium truncate max-w-full">
                {{ item.label }}
            </span>
        </a>
        }
    </div>
</nav>

<!-- Mobile Slide-out Menu -->
@if (isMenuOpen()) {
<div class="fixed inset-0 z-50 md:hidden">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black bg-opacity-50 transition-opacity" (click)="closeMenu()"
        (touchstart)="onBackdropTouchStart($event)" (touchend)="onBackdropTouchEnd($event)">
    </div>

    <!-- Menu Panel -->
    <div class="fixed inset-y-0 left-0 w-80 max-w-sm bg-white dark:bg-gray-900 shadow-xl transform transition-transform"
        [class.translate-x-0]="isMenuOpen()" [class.-translate-x-full]="!isMenuOpen()"
        (touchstart)="onMenuTouchStart($event)" (touchmove)="onMenuTouchMove($event)"
        (touchend)="onMenuTouchEnd($event)">

        <!-- Menu Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Menu</h2>
            <button (click)="closeMenu()"
                class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                aria-label="Close menu">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>

        <!-- Menu Content -->
        <div class="flex-1 overflow-y-auto">
            <ng-content select="[slot=menu-content]"></ng-content>
        </div>
    </div>
</div>
}

<!-- Desktop Navigation -->
<nav class="hidden md:block bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center space-x-8">
                <ng-content select="[slot=logo]"></ng-content>

                <div class="flex space-x-8">
                    @for (item of items(); track item.id) {
                    <a [routerLink]="item.href" routerLinkActive="text-primary border-primary"
                        class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300 transition-colors">
                        <i [class]="item.icon + ' mr-2'"></i>
                        {{ item.label }}
                        @if (item.badge) {
                        <span
                            class="ml-2 bg-red-500 text-white text-xs rounded-full min-w-5 h-5 flex items-center justify-center px-1">
                            {{ item.badge }}
                        </span>
                        }
                    </a>
                    }
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <ng-content select="[slot=actions]"></ng-content>
            </div>
        </div>
    </div>
</nav>
