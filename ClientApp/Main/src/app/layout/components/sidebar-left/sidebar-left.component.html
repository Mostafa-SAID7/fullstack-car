<div
    class="flex flex-col h-full p-3 space-y-4 animate-fade-in items-stretch bg-white dark:bg-[#111] border border-black/5 dark:border-white/10 shadow-xl dark:shadow-2xl rounded-2xl overflow-hidden">

    <!-- Main Navigation Items (Scrollable) -->
    <div class="flex-1 space-y-6 overflow-y-auto pr-1 -mr-1 custom-scroll w-full">
        <app-community-sidebar-left
            *ngIf="currentSection === 'community' || currentSection === 'default'"></app-community-sidebar-left>
        <app-media-sidebar-left
            *ngIf="currentSection === 'video' || currentSection === 'media' || currentSection === 'podcast'"></app-media-sidebar-left>
        <app-marketplace-sidebar-left *ngIf="currentSection === 'marketplace'"></app-marketplace-sidebar-left>
    </div>


    <!-- Bottom Section (User Profile & Navigation Switcher) -->
    <div class="mt-auto pt-4 space-y-4 w-full">
        <!-- Profile Link -->
        <div routerLink="/community/profile"
            class="flex items-center justify-start md:justify-center lg:justify-start gap-3 p-2 rounded-2xl transition-all hover:bg-primary/5 dark:hover:bg-primary/10 cursor-pointer group border border-transparent hover:border-primary/20">
            <div
                class="w-10 h-10 flex-shrink-0 rounded-full bg-gradient-to-tr from-primary to-purple-600 flex items-center justify-center text-white font-black shadow-lg shadow-primary/20 overflow-hidden text-xs">
                <img *ngIf="currentUser?.profileImageUrl" [src]="currentUser.profileImageUrl"
                    class="w-full h-full object-cover">
                <span *ngIf="!currentUser?.profileImageUrl">{{ currentUser?.firstName?.[0] || 'U' }}{{
                    currentUser?.lastName?.[0] || 'P' }}</span>
            </div>
            <div class="flex-col min-w-0 flex md:hidden lg:flex">
                <span class="font-extrabold text-xs text-foreground truncate">{{ currentUser?.firstName ?
                    currentUser.firstName + ' ' +
                    currentUser.lastName : 'User Account' }}</span>
                <span class="text-[9px] text-primary/60 font-black uppercase tracking-wider">Account Settings</span>
            </div>
        </div>

        <!-- Global Navigation Shortcut (To help switch between sections) -->
        <div class="grid md:hidden lg:grid grid-cols-3 gap-2 p-1 bg-slate-100 dark:bg-white/5 rounded-xl">
            <button routerLink="/community"
                class="flex items-center justify-center p-2 rounded-xl transition-all hover:bg-secondary dark:hover:bg-white/5 active:scale-95 group"
                [attr.title]="'Community'"
                [ngClass]="{'bg-white shadow-sm dark:bg-white/10': currentSection === 'community'}">
                <i class="fa-solid fa-user-group text-[11px] text-gray-500 dark:text-gray-400 group-hover:text-primary transition-colors"
                    [class.!text-primary]="currentSection === 'community'"></i>
            </button>
            <button routerLink="/media"
                class="flex items-center justify-center p-2 rounded-xl transition-all hover:bg-secondary dark:hover:bg-white/5 active:scale-95 group"
                [attr.title]="'Media Hub'"
                [ngClass]="{'bg-white shadow-sm dark:bg-white/10': currentSection === 'media'}">
                <i class="fa-solid fa-play text-[11px] text-gray-500 dark:text-gray-400 group-hover:text-blue-500 transition-colors"
                    [class.!text-blue-500]="currentSection === 'media'"></i>
            </button>
            <button routerLink="/marketplace"
                class="flex items-center justify-center p-2 rounded-xl transition-all hover:bg-secondary dark:hover:bg-white/5 active:scale-95 group"
                [attr.title]="'Marketplace'"
                [ngClass]="{'bg-white shadow-sm dark:bg-white/10': currentSection === 'marketplace'}">
                <i class="fa-solid fa-store text-[11px] text-gray-500 dark:text-gray-400 group-hover:text-emerald-500 transition-colors"
                    [class.!text-emerald-500]="currentSection === 'marketplace'"></i>
            </button>
        </div>


    </div>
</div>
