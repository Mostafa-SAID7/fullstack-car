<div class="media-dashboard p-4 lg:p-8 max-w-7xl mx-auto">
  <!-- Header -->
  <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-8 relative">
    <!-- Abstract Shape -->
    <div class="absolute -top-20 -left-20 w-64 h-64 bg-blue-500/10 blur-[100px] rounded-full"></div>

    <div class="relative">
      <h1
        class="text-5xl font-black text-slate-900 dark:text-white tracking-tighter uppercase italic leading-none mb-2">
        Media Center</h1>
      <p class="text-slate-500 font-bold text-xs uppercase tracking-[0.3em] flex items-center gap-2">
        <span class="w-8 h-px bg-blue-500"></span>
        The Heart of Automotive Content
      </p>
    </div>

    <div class="flex gap-4 relative">
      <button (click)="navigateToUpload('video')"
        class="h-14 px-8 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl font-black uppercase tracking-widest text-xs hover:scale-105 active:scale-95 transition-all shadow-xl shadow-slate-900/10 dark:shadow-white/10 flex items-center gap-3">
        <i class="fas fa-video"></i> Broadcast Video
      </button>
      <button (click)="navigateToUpload('podcast')"
        class="h-14 px-8 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-blue-700 hover:shadow-xl hover:shadow-blue-500/20 hover:-translate-y-1 active:translate-y-0 transition-all flex items-center gap-3">
        <i class="fas fa-microphone"></i> Start Podcast
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="space-y-12">
    <div *ngFor="let i of [1,2]" class="space-y-6">
      <div class="h-8 bg-slate-100 dark:bg-slate-800 rounded-xl w-48 animate-pulse"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let j of [1,2,3]"
          class="aspect-video bg-slate-50 dark:bg-slate-900 rounded-3xl animate-pulse border border-slate-100 dark:border-slate-800">
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!loading" class="space-y-16">

    <!-- Trending Videos Section -->
    <section *ngIf="trendingVideos.length > 0" class="relative">
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-black text-slate-900 dark:text-white uppercase tracking-tight flex items-center gap-3">
          <span class="w-10 h-10 bg-orange-100 dark:bg-orange-500/10 rounded-xl flex items-center justify-center">
            <i class="fas fa-fire text-orange-500 text-lg"></i>
          </span>
          Trending Videos
        </h2>
        <button (click)="navigateToVideos()"
          class="group px-4 py-2 text-xs font-black text-blue-500 uppercase tracking-widest flex items-center gap-2 hover:bg-blue-50 dark:hover:bg-blue-500/10 rounded-lg transition-all">
          Explore All <i class="fas fa-arrow-right transition-transform group-hover:translate-x-1"></i>
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <app-media-card *ngFor="let video of trendingVideos" [media]="video" [type]="'video'" (play)="playVideo(video)">
        </app-media-card>
      </div>
    </section>

    <!-- Trending Podcasts Section -->
    <section *ngIf="trendingPodcasts.length > 0">
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-black text-slate-900 dark:text-white uppercase tracking-tight flex items-center gap-3">
          <span class="w-10 h-10 bg-blue-100 dark:bg-blue-500/10 rounded-xl flex items-center justify-center">
            <i class="fas fa-wave-square text-blue-500 text-lg"></i>
          </span>
          Popular Podcasts
        </h2>
        <button (click)="navigateToPodcasts()"
          class="group px-4 py-2 text-xs font-black text-blue-500 uppercase tracking-widest flex items-center gap-2 hover:bg-blue-50 dark:hover:bg-blue-500/10 rounded-lg transition-all">
          Tune In <i class="fas fa-arrow-right transition-transform group-hover:translate-x-1"></i>
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <app-media-card *ngFor="let podcast of trendingPodcasts" [media]="podcast" [type]="'podcast'"
          (play)="playPodcast(podcast)">
        </app-media-card>
      </div>
    </section>

    <!-- Recent Content (Two Columns for Desk) -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
      <!-- Recent Videos -->
      <section *ngIf="recentVideos.length > 0">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-lg font-black text-slate-900 dark:text-white uppercase tracking-tight">Recent Clips</h3>
        </div>
        <div class="space-y-4">
          <div *ngFor="let video of recentVideos"
            class="flex gap-4 p-3 bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 hover:shadow-xl hover:shadow-slate-200/50 dark:hover:shadow-black transition-all cursor-pointer group"
            (click)="playVideo(video)">
            <div class="w-32 h-20 bg-slate-100 dark:bg-slate-950 rounded-xl overflow-hidden flex-shrink-0 relative">
              <img *ngIf="video.thumbnailUrl || video.thumbnail" [src]="video.thumbnailUrl || video.thumbnail"
                class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
              <div
                class="absolute inset-0 bg-blue-600/0 group-hover:bg-blue-600/20 flex items-center justify-center transition-all">
                <i
                  class="fas fa-play text-white opacity-0 group-hover:opacity-100 scale-50 group-hover:scale-100 transition-all"></i>
              </div>
            </div>
            <div class="flex flex-col justify-center">
              <h4
                class="font-bold text-sm text-slate-900 dark:text-white line-clamp-1 group-hover:text-blue-600 transition-colors">
                {{ video.title }}</h4>
              <p class="text-[10px] text-slate-500 font-bold uppercase mt-1">{{ video.creatorName }} • {{
                video.viewCount }} Views</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Recent Podcasts -->
      <section *ngIf="recentPodcasts.length > 0">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-lg font-black text-slate-900 dark:text-white uppercase tracking-tight">Latest Audio</h3>
        </div>
        <div class="space-y-4">
          <div *ngFor="let podcast of recentPodcasts"
            class="flex gap-4 p-3 bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 hover:shadow-xl hover:shadow-slate-200/50 dark:hover:shadow-black transition-all cursor-pointer group"
            (click)="playPodcast(podcast)">
            <div
              class="w-20 h-20 bg-blue-50 dark:bg-blue-950 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center">
              <img *ngIf="podcast.thumbnailUrl || podcast.coverImage" [src]="podcast.thumbnailUrl || podcast.coverImage"
                class="w-full h-full object-cover">
              <i *ngIf="!podcast.thumbnailUrl && !podcast.coverImage"
                class="fas fa-microphone text-blue-500 opacity-50"></i>
            </div>
            <div class="flex flex-col justify-center">
              <h4
                class="font-bold text-sm text-slate-900 dark:text-white line-clamp-1 group-hover:text-blue-600 transition-colors">
                {{ podcast.title }}</h4>
              <p class="text-[10px] text-slate-500 font-bold uppercase mt-1">EP {{ podcast.episodeNumber }} • {{
                podcast.playCount }} Plays</p>
            </div>
          </div>
        </div>
      </section>
    </div>

  </div>
</div>
