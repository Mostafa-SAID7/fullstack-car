<div class="podcast-upload-container p-4 lg:p-8 max-w-4xl mx-auto">
  <div class="header mb-8 flex items-center gap-4">
    <div
      class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
      <i class="fas fa-microphone-alt text-xl"></i>
    </div>
    <div>
      <h1 class="text-3xl font-black text-slate-900 dark:text-white leading-none mb-1">Upload Podcast</h1>
      <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Broadcast your voice to the automotive world
      </p>
    </div>
  </div>

  <div
    class="bg-white dark:bg-slate-900 rounded-3xl p-6 lg:p-10 shadow-2xl border border-slate-200 dark:border-slate-800 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-600 to-indigo-600"></div>

    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="space-y-8">
      <!-- Audio Drop Zone -->
      <div
        class="audio-drop-zone border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-3xl p-10 transition-all hover:border-blue-500 hover:bg-slate-50 dark:hover:bg-slate-950 group cursor-pointer text-center"
        (click)="audioInput.click()">
        <input #audioInput type="file" (change)="onFileSelected($event)" accept="audio/*" class="hidden">

        <div class="flex flex-col items-center">
          <div
            class="w-20 h-20 bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-600 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 group-hover:bg-blue-100 group-hover:text-blue-600 dark:group-hover:bg-blue-900/30 transition-all duration-300">
            <i class="fas fa-music text-3xl"></i>
          </div>

          <div *ngIf="!selectedFile">
            <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Drop your audio file here</h3>
            <p class="text-sm text-slate-500 font-medium">Or click to select from your device</p>
            <div class="mt-6 flex gap-2 justify-center">
              <span
                class="px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded text-[10px] font-black text-slate-500 uppercase">MP3</span>
              <span
                class="px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded text-[10px] font-black text-slate-500 uppercase">WAV</span>
              <span
                class="px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded text-[10px] font-black text-slate-500 uppercase">M4A</span>
            </div>
          </div>

          <div *ngIf="selectedFile" class="flex flex-col items-center gap-2">
            <div
              class="px-6 py-4 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-900 rounded-2xl flex items-center gap-4">
              <div class="w-10 h-10 bg-blue-600 text-white rounded-lg flex items-center justify-center">
                <i class="fas fa-volume-up"></i>
              </div>
              <div class="text-left">
                <p class="text-sm font-black text-slate-900 dark:text-white truncate max-w-[240px]">{{ selectedFile.name
                  }}</p>
                <p class="text-[10px] text-blue-600 font-bold uppercase">{{ (selectedFile.size / 1024 / 1024).toFixed(2)
                  }} MB • Audio Track</p>
              </div>
              <button type="button" (click)="$event.stopPropagation(); selectedFile = null"
                class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-500 transition-colors">
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
        <!-- Details -->
        <div class="space-y-6">
          <div>
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Episode Title</label>
            <input formControlName="title" type="text" placeholder="Give your podcast a catchy title"
              class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800 rounded-2xl px-5 py-4 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white placeholder:text-slate-400 font-medium">
          </div>

          <div>
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Episode
              Summary</label>
            <textarea formControlName="description" rows="6" placeholder="What is this episode about?"
              class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800 rounded-2xl px-5 py-4 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white placeholder:text-slate-400 font-medium resize-none"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Season No.</label>
              <input formControlName="seasonNumber" type="number"
                class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800 rounded-2xl px-5 py-4 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white font-bold">
            </div>
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Episode No.</label>
              <input formControlName="episodeNumber" type="number"
                class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800 rounded-2xl px-5 py-4 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white font-bold">
            </div>
          </div>
        </div>

        <!-- Meta & Transcription -->
        <div class="space-y-6">
          <div>
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Series
              (Optional)</label>
            <select formControlName="seriesId"
              class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800 rounded-2xl px-5 py-4 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white font-bold cursor-pointer appearance-none">
              <option value="">No Series / Standalone</option>
              <option *ngFor="let s of series" [value]="s.id">{{ s.name }}</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Transcript
              (Optional)</label>
            <textarea formControlName="transcript" rows="6" placeholder="Paste the episode transcript here..."
              class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800 rounded-2xl px-5 py-4 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white placeholder:text-slate-400 font-medium resize-none"></textarea>
          </div>

          <div
            class="bg-slate-50 dark:bg-slate-950 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 space-y-4">
            <h4 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Options</h4>
            <label class="flex items-center justify-between group cursor-pointer">
              <span
                class="text-sm font-bold text-slate-600 dark:text-slate-400 group-hover:text-blue-500 transition-colors">Public
                Episode</span>
              <input type="checkbox" formControlName="isPublic"
                class="w-5 h-5 rounded-lg border-2 border-slate-200 dark:border-slate-800 bg-transparent checked:bg-blue-600 transition-all cursor-pointer">
            </label>
            <label class="flex items-center justify-between group cursor-pointer">
              <span
                class="text-sm font-bold text-slate-600 dark:text-slate-400 group-hover:text-blue-500 transition-colors">Enable
                Comments</span>
              <input type="checkbox" formControlName="allowComments"
                class="w-5 h-5 rounded-lg border-2 border-slate-200 dark:border-slate-800 bg-transparent checked:bg-blue-600 transition-all cursor-pointer">
            </label>
            <label class="flex items-center justify-between group cursor-pointer">
              <span
                class="text-sm font-bold text-slate-600 dark:text-slate-400 group-hover:text-blue-500 transition-colors">Allow
                Downloads</span>
              <input type="checkbox" formControlName="allowDownload"
                class="w-5 h-5 rounded-lg border-2 border-slate-200 dark:border-slate-800 bg-transparent checked:bg-blue-600 transition-all cursor-pointer">
            </label>
          </div>
        </div>
      </div>

      <div class="pt-10 flex flex-col items-center">
        <div *ngIf="error"
          class="mb-6 p-4 bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-800 rounded-2xl flex items-center gap-3 text-red-600">
          <i class="fas fa-exclamation-triangle"></i>
          <span class="text-sm font-bold">{{ error }}</span>
        </div>

        <button type="submit" [disabled]="uploadForm.invalid || !selectedFile || uploading"
          class="w-full max-w-sm py-5 bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-full font-black uppercase tracking-[0.2em] text-xs shadow-2xl shadow-blue-500/30 hover:shadow-blue-500/50 hover:-translate-y-1 active:scale-95 transition-all flex items-center justify-center gap-4">
          <span *ngIf="uploading"
            class="w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
          {{ uploading ? 'Broadcasting...' : 'Publish Episode' }}
        </button>
      </div>
    </form>
  </div>
</div>
